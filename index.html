<!doctype html>
<!-- =============================================================================
  index.html — КАРКАС СТОРІНКИ NEXORA AI · ЛАБОРАТОРІЯ NEXI
  Canvas #world — уся кімната (малює js/core/loop.js).
  Поверх — HTML-інтерфейс (стилі css/hud.css, логіка js/ui/*).
  Скрипти підключаються ПО ПОРЯДКУ: ядро -> світ -> персонажі -> об'єкти -> UI -> старт.
============================================================================== -->
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexora AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/hud.css">
</head>
<body>
<canvas id="world" aria-label="Кімната Nexi"></canvas>

<!-- Верхнє меню: кнопки запускають сценарії Nexi -->
<div class="hud top"><div class="logo">NEXORA AI<small id="tagline"></small></div><nav id="nav"></nav><span class="coins" id="coins" title="Nexora coins"><i></i>0</span><button class="skinbtn" id="skinbtn"></button></div>
<!-- Чип поточної задачі -->
<div class="hud task" id="task"><b id="tk-n"></b><span id="tk-t"></span><i id="tk-p"></i></div>
<!-- Підказка для нового користувача -->
<div class="hud hint" id="hint"></div>
<!-- Бабл над Nexi -->
<div class="bub" id="bub"><b>NEXI</b><span></span></div>
<!-- Діалог -->
<div class="hud chat"><div class="panel" id="panel"><div class="log" id="log" aria-live="polite"></div><div class="chips" id="chips"></div><form class="ask" id="ask"><input id="q" autocomplete="off"><button aria-label="Надіслати">&gt;</button></form></div><button class="tg" id="tg"></button></div>
<!-- Лабораторія скінів -->
<aside class="lab" id="lab" aria-label="Лабораторія скінів">
 <header><h2 id="labtitle"></h2><button class="x" id="lx" aria-label="Закрити">X</button></header>
 <div class="stage"><button class="ar l" id="pl" aria-label="Попередній">&lt;</button><canvas id="pv" width="48" height="56"></canvas><button class="ar r" id="pr" aria-label="Наступний">&gt;</button></div>
 <div class="cats" id="cats"></div><div class="grid" id="grid"></div>
 <div class="acts"><button id="rnd"></button><button id="rst"></button><button class="save" id="save"></button></div>
</aside>
<div class="toast" id="toast"></div>
<!-- Меню робочої зони і картка результату (ui/zones.js) -->
<div class="zmenu" id="zmenu"></div>
<div class="result" id="result"><b></b><span></span></div>

<!-- ядро -->
<script src="js/core/namespace.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/i18n/uk.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/i18n/pl.js"></script>
<script src="js/i18n/nl.js"></script>
<script src="js/core/config.js"></script>
<script src="js/core/pixel.js"></script>
<script src="js/core/pixelart.js"></script>
<script src="js/core/persp.js"></script>
<script src="js/core/furniture.js"></script>
<script src="js/core/px3d.js"></script>       <!-- піксельне 3D (z-буфер) для крил «по дузі» -->
<script src="js/core/camera.js"></script>
<script src="js/core/loop.js"></script>
<!-- світ -->
<script src="js/world/room.js"></script>
<script src="js/world/city_kit.js"></script>
<script src="js/world/city_sky.js"></script>
<script src="js/world/city_build.js"></script>
<script src="js/world/city_mega.js"></script>
<script src="js/world/cityscape.js"></script>
<script src="js/fx/particles.js"></script>
<!-- Nexi: дані скінів, малювання, пози -->
<script src="js/actors/nexi/skins.js"></script>
<script src="js/actors/nexi/sprite.js"></script>
<script src="js/actors/nexi/poses.js"></script>
<script src="js/actors/nexi/physics.js"></script>
<script src="js/actors/cat/cat_sprite.js"></script>
<!-- об'єкти кімнати (кожен — окремий блок) -->
<script src="js/objects/wing_kit.js"></script>
<script src="js/objects/wing_trinkets.js"></script>
<script src="js/objects/wing_screens.js"></script>
<script src="js/objects/wing_wall.js"></script>
<script src="js/objects/wing_decor.js"></script>
<script src="js/objects/wing_react.js"></script>
<script src="js/objects/window_frame.js"></script>
<script src="js/objects/ai_center.js"></script>
<script src="js/objects/analytics.js"></script>
<script src="js/objects/marketing.js"></script>
<script src="js/objects/wing_plants.js"></script>
<script src="js/objects/wing_props.js"></script>
<script src="js/objects/wing_floor.js"></script>
<script src="js/objects/wing_air.js"></script>
<!-- праве крило (кодом, як ліве): стіна й антресоль -> майстерня -> інструменти -> портал -> рослини -> сяйво й підлога.
     До рослини біля дивану (plant_care.js): машинерія майстерні стоїть позаду неї -->
<script src="js/objects/rwing_wall.js"></script>
<script src="js/objects/workshop.js"></script>
<script src="js/objects/tools.js"></script>
<script src="js/objects/portal.js"></script>
<script src="js/objects/rwing_plants.js"></script>
<script src="js/objects/rwing_floor.js"></script>
<script src="js/objects/arc_layout.js"></script>  <!-- розкладка крил «по дузі» (генерує tools/wingbox/gen_room.py) -->
<script src="js/objects/rwing_box.js"></script>   <!-- СІРИЙ МАКЕТ (лише з адресою #rw-box) -->
<!-- КРИЛА «ПО ДУЗІ» В ПІКСЕЛЬНОМУ 3D (лише з адресою #rw-3d): матеріали -> рослини -> сцена -->
<script src="js/objects/arc_kit.js"></script>
<script src="js/objects/arc_paint.js"></script>
<script src="js/objects/arc_shapes.js"></script>
<script src="js/objects/arc_plants.js"></script>
<script src="js/objects/arc_scene.js"></script>
<script src="js/objects/arc_live.js"></script>
<script src="js/objects/office.js"></script>
<script src="js/objects/coffee.js"></script>
<script src="js/objects/plant_care.js"></script>   <!-- рослина біля дивану — ДО дивану: стоїть позаду підлокітника -->
<script src="js/objects/sofa.js"></script>
<script src="js/objects/cat_corner.js"></script>
<script src="js/objects/rug_dock.js"></script>
<script src="js/objects/fountain.js"></script>
<script src="js/objects/ball.js"></script>
<script src="js/objects/lounge.js"></script>
<script src="js/objects/vacuum.js"></script>
<script src="js/objects/coins.js"></script>
<script src="js/objects/laser.js"></script>
<script src="js/objects/plants_front.js"></script>
<!-- персонажі -->
<script src="js/actors/nexi/nexi.js"></script>
<script src="js/actors/nexi/activities.js"></script>
<script src="js/actors/cat/cat.js"></script>
<script src="js/actors/visitors/engine.js"></script>
<script src="js/actors/visitors/dracula.js"></script>
<script src="js/actors/visitors/vovkulaka.js"></script>
<script src="js/actors/visitors/mushroom.js"></script>
<script src="js/actors/visitors/sherlock.js"></script>
<script src="js/actors/visitors/babayaga.js"></script>
<script src="js/actors/visitors/kolobok.js"></script>
<script src="js/actors/visitors/merlin.js"></script>
<script src="js/actors/visitors/cheshire.js"></script>
<script src="js/actors/visitors/snowwhite.js"></script>
<script src="js/actors/visitors/leprechaun.js"></script>
<!-- інтерфейс -->
<script src="js/ui/input.js"></script>
<script src="js/ui/hud.js"></script>
<script src="js/ui/skinlab.js"></script>
<script src="js/ui/chat.js"></script>
<script src="js/ui/zones.js"></script>
<script src="js/main.js"></script>
</body>
</html>

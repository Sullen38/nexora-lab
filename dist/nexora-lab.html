<!doctype html>
<!-- =============================================================================
  index.html — КАРКАС СТОРІНКИ NEXORA AI · ЛАБОРАТОРІЯ NEXI
  Canvas #world — уся кімната (малює js/core/loop.js).
  Поверх — HTML-інтерфейс (стилі css/hud.css, логіка js/ui/*).
  Скрипти підключаються ПО ПОРЯДКУ: ядро -> світ -> персонажі -> об'єкти -> UI -> старт.
============================================================================== -->
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexora AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ============================================================================
 * css/hud.css — СТИЛІ ІНТЕРФЕЙСУ ПОВЕРХ КІМНАТИ
 * Кольори й шрифти задані змінними в :root — міняються в одному місці.
 * Блоки: .top (меню) · .task (чип задачі) · .hint · .bub (бабл Nexi)
 *        .chat (діалог) · .lab (лабораторія скінів) · .toast
 * ========================================================================== */
:root{--bg:#050818;--glass:#070c2cd9;--line:#2a4ab8;--cyan:#3be8ff;--pink:#d94bff;--text:#dbe7ff;--mute:#8393cc;--gold:#ffc94d;
--f-d:'Press Start 2P','Courier New',monospace;--f-b:'Rubik','Segoe UI',system-ui,sans-serif;--f-m:'JetBrains Mono',ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:500 14px/1.4 var(--f-b);overflow:hidden;touch-action:none}
#world{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:5}
.top{left:0;right:0;top:0;display:flex;align-items:center;gap:14px;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));padding-top:max(10px,env(safe-area-inset-top,0px));background:linear-gradient(#050818f2,#05081800);pointer-events:none}
.top>*{pointer-events:auto}
.logo{font:400 15px var(--f-d);color:var(--cyan);text-shadow:0 0 12px #2ad4ff;line-height:1;white-space:nowrap}
.logo small{display:block;font:400 6px var(--f-d);color:var(--mute);margin-top:6px;letter-spacing:1px}
nav{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:2px}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;background:var(--glass);color:var(--text);border:2px solid #1b2a66;padding:8px 12px;font:600 11px var(--f-b);letter-spacing:.8px;cursor:pointer;backdrop-filter:blur(6px)}
nav button:hover{border-color:var(--cyan)}
nav button.on{border-color:var(--pink);color:#fff;box-shadow:0 0 14px #d94bff66 inset}
.langbtn{flex:none;background:var(--glass);color:var(--gold);border:2px solid var(--gold);padding:7px 9px;font:400 8px var(--f-d);cursor:pointer}
.skinbtn{flex:none;background:var(--pink);color:#fff;border:0;padding:9px 12px;font:400 8px var(--f-d);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.task{left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));display:none;align-items:center;gap:12px;background:var(--glass);border:2px solid var(--cyan);padding:10px 16px;box-shadow:0 0 22px #3be8ff55;max-width:92vw}
.task b{font:400 8px var(--f-d);color:var(--cyan);white-space:nowrap}
.task span{font:500 13px var(--f-b);white-space:nowrap}
.task i{display:block;width:110px;height:8px;border:2px solid #1b2a66;position:relative;flex:none}
.task i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:var(--cyan)}
.hint{left:max(14px,env(safe-area-inset-left,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));font:400 7px/1.7 var(--f-d);color:var(--mute);background:var(--glass);border:2px solid #1b2a66;padding:9px 11px;max-width:260px}
.bub{position:fixed;z-index:6;display:none;max-width:min(300px,70vw);background:#050a26f2;border:2px solid var(--cyan);box-shadow:0 0 14px #3be8ff77;padding:9px 12px;font:500 13px/1.4 var(--f-b);pointer-events:none}
.bub b{display:block;color:var(--cyan);font:400 7px var(--f-d);margin-bottom:5px}
.bub::after{content:"";position:absolute;left:var(--tail,40px);bottom:-9px;width:12px;height:12px;background:#050a26;border:solid var(--cyan);border-width:0 2px 2px 0;transform:rotate(45deg)}
.chat{right:max(14px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 28px));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.chat .tg{background:var(--glass);color:var(--cyan);border:2px solid var(--cyan);padding:9px 12px;font:400 8px var(--f-d);cursor:pointer}
.panel{width:100%;background:var(--glass);border:2px solid var(--line);padding:10px;backdrop-filter:blur(8px);display:none}
.panel.open{display:block}
.log{height:170px;overflow:auto;background:#060a22;border:2px solid #17235c;padding:8px;font:400 12px/1.5 var(--f-m);display:flex;flex-direction:column;gap:6px}
.log div{padding:6px 8px;max-width:92%}
.log .b{background:#0f1b4d;border-left:3px solid var(--cyan)}
.log .u{background:#2a1450;border-right:3px solid var(--pink);align-self:flex-end}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.chips button{background:#0a1236;border:1px solid #1b2a66;color:var(--cyan);padding:4px 8px;font:600 11px var(--f-b);cursor:pointer}
.ask{display:flex;gap:6px;margin-top:8px}
.ask input{flex:1;min-width:0;background:#060a22;border:2px solid #17235c;color:var(--text);padding:8px;font:400 12px var(--f-m)}
.ask button{background:var(--cyan);border:0;color:#041030;font:700 14px var(--f-b);padding:0 14px;cursor:pointer}
.lab{position:fixed;z-index:8;top:0;right:0;bottom:0;width:min(440px,100vw);background:#060a24f2;border-left:2px solid var(--pink);box-shadow:-10px 0 40px #000a;transform:translateX(105%);transition:transform .3s;display:flex;flex-direction:column;backdrop-filter:blur(8px)}
.lab.open{transform:none}
.lab header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top,0px))}
.lab h2{margin:0;font:400 11px var(--f-d);color:var(--cyan)}
.x{background:none;border:2px solid #1b2a66;color:var(--text);font:400 12px var(--f-d);padding:7px 9px;cursor:pointer}
.stage{margin:0 16px;height:190px;border:2px solid #17235c;background:radial-gradient(ellipse at 50% 90%,#1a52b0 0,#0a1240 45%,#050818 75%);position:relative;display:flex;align-items:center;justify-content:center;flex:none}
.stage canvas{height:168px;width:144px;image-rendering:pixelated}
.stage .ar{position:absolute;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--pink);font:400 20px var(--f-d);cursor:pointer;padding:10px}
.ar.l{left:4px}.ar.r{right:4px}
.cats{display:flex;gap:4px;overflow-x:auto;padding:12px 16px 6px;flex:none}
.cats button{flex:none;background:#0a1236;color:var(--mute);border:2px solid #1b2a66;padding:7px 10px;font:600 11px var(--f-b);cursor:pointer;white-space:nowrap}
.cats button.on{color:#fff;border-color:var(--pink)}
.grid{flex:1;overflow:auto;padding:8px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;align-content:start}
.tile{background:#080d2a;border:2px solid #17235c;padding:4px 2px 5px;color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 9px var(--f-b);letter-spacing:.4px;text-transform:uppercase}
.tile canvas{width:72px;height:80px;image-rendering:pixelated}
.tile:hover{border-color:var(--cyan)}
.tile.on{border-color:var(--gold);background:#1a1740}
.acts{display:flex;gap:8px;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));flex:none}
.acts button{flex:1;border:0;padding:12px 6px;font:400 8px var(--f-d);cursor:pointer;background:#16205a;color:var(--text)}
.acts .save{background:var(--cyan);color:#041030}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:20;background:var(--gold);color:#201400;padding:10px 16px;font:400 9px var(--f-d);opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
@media(max-width:820px){.logo small{display:none}.hint{display:none}.chat{bottom:76px}.task{bottom:12px;padding:8px 12px}.task span{font-size:12px}.task i{width:60px}}
@media(prefers-reduced-motion:reduce){.lab,.toast{transition:none}}

</style>
</head>
<body>
<canvas id="world" aria-label="Кімната Nexi"></canvas>

<!-- Верхнє меню: кнопки запускають сценарії Nexi -->
<div class="hud top"><div class="logo">NEXORA AI<small id="tagline"></small></div><nav id="nav"></nav><button class="langbtn" id="langbtn">UA</button><button class="skinbtn" id="skinbtn"></button></div>
<!-- Чип поточної задачі -->
<div class="hud task" id="task"><b id="tk-n"></b><span id="tk-t"></span><i id="tk-p"></i></div>
<!-- Підказка для нового користувача -->
<div class="hud hint" id="hint"></div>
<!-- Бабл над Nexi -->
<div class="bub" id="bub"><b>NEXI</b><span></span></div>
<!-- Діалог -->
<div class="hud chat"><div class="panel" id="panel"><div class="log" id="log" aria-live="polite"></div><div class="chips" id="chips"></div><form class="ask" id="ask"><input id="q" autocomplete="off"><button aria-label="Надіслати">&gt;</button></form></div><button class="tg" id="tg"></button></div>
<!-- Лабораторія скінів -->
<aside class="lab" id="lab" aria-label="Лабораторія скінів">
 <header><h2 id="labtitle"></h2><button class="x" id="lx" aria-label="Закрити">X</button></header>
 <div class="stage"><button class="ar l" id="pl" aria-label="Попередній">&lt;</button><canvas id="pv" width="48" height="56"></canvas><button class="ar r" id="pr" aria-label="Наступний">&gt;</button></div>
 <div class="cats" id="cats"></div><div class="grid" id="grid"></div>
 <div class="acts"><button id="rnd"></button><button id="rst"></button><button class="save" id="save"></button></div>
</aside>
<div class="toast" id="toast"></div>

  lang: 'uk', dict: {},
  add(lang, obj) { this.dict[lang] = obj; },
  detect() {

    for (const l of (navigator.languages || [navigator.language || 'en'])) { const p = String(l).slice(0, 2).toLowerCase(); if (this.LANGS.includes(p)) return p; }

  get(obj, key) { return key.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj); },

  const I = NX.i18n; let v = I.get(I.dict[I.lang], key); if (v === undefined) v = I.get(I.dict.uk, key); if (v === undefined) return key;

<script>
/* ---- js/core/pixel.js ---- */
/* ============================================================================
 * core/pixel.js — ПІКСЕЛЬНІ ІНСТРУМЕНТИ МАЛЮВАННЯ
 * ----------------------------------------------------------------------------
 * Маленька бібліотека для 8-bit графіки на Canvas 2D:
 *   shade(hex, k)              – освітлити (k>0) / затемнити (k<0) колір
 *   rect(c,x,y,w,h,col)        – прямокутник
 *   cube(c,x,y,w,h,d,f,t,s)    – об'ємний "2.5D" куб: передня грань, верх, бік
 *   glow(c,x,y,r,col,a)        – м'яке неонове світіння (адитивне)
 *   holo(c,x,y,w,h,col,t,a)    – голографічна панель зі скан-лініями
 *   stair(c,x0,y0,x1,y1,col,s) – піксельна "сходинкова" лінія
 *   text(c,s,x,y,col,size)     – піксельний текст шрифтом Press Start 2P
 *   hash(n)                    – детермінований псевдовипадковий 0..1
 *   depthK(y) / depth(c,x,y,fn) – ПЕРСПЕКТИВА: предмет ближче до глядача
 *                                малюється більшим (як і Nexi)
 * ========================================================================== */
NX.px = (() => {
  const hx = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const toHex = a => '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  const shade = (h, k) => { if (h[0] !== '#') return h; const c = hx(h); return toHex(k >= 0 ? c.map(v => v + (255 - v) * k) : c.map(v => v * (1 + k))); };
  /** Прямокутник, прив'язаний до реальних пікселів екрана — без розмитих країв. */
  const rect = (c, x, y, w, h, col) => {
    const K = NX.cam.k * (NX.loop.dpr || 1), x1 = Math.round(x * K) / K, y1 = Math.round(y * K) / K;
    c.fillStyle = col; c.fillRect(x1, y1, Math.max(1 / K, Math.round((x + w) * K) / K - x1), Math.max(1 / K, Math.round((y + h) * K) / K - y1));
  };
  /** Куб з "косою" глибиною 45°: y — нижня лінія передньої грані. U — розмір пікселя. */
  function cube(c, x, y, w, h, d, f, t, s, U = 2) {
    const n = Math.max(1, Math.round(d / U));
    for (let k = 0; k < n; k++) { rect(c, x + w + k * U, y - h - (k + 1) * U, U, h, s); rect(c, x + (k + 1) * U, y - h - (k + 1) * U, w, U, t); }
    rect(c, x, y - h, w, h, f); rect(c, x, y - h, w, U, shade(f, .3)); rect(c, x, y - U, w, U, shade(f, -.35));
  }
  function glow(c, x, y, r, col, a = 1) {
    c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = a;
    const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2); c.restore();
  }
  function holo(c, x, y, w, h, col, t, a = 1) {
    c.save(); c.globalAlpha = a * (.85 + .15 * Math.sin(t * 17));
    c.fillStyle = col + '22'; c.fillRect(x, y, w, h);
    for (let yy = y; yy < y + h; yy += 3) rect(c, x, yy, w, .5, col + '22');
    c.strokeStyle = col; c.lineWidth = 1; c.strokeRect(x + .5, y + .5, w - 1, h - 1); c.restore();
  }
  function stair(c, x0, y0, x1, y1, col, s = 2) {
    const n = Math.max(1, Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) / s | 0);
    for (let i = 0; i <= n; i++) rect(c, x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, s, s, col);
  }
  function text(c, s, x, y, col, size = 6, align = 'left') {
    c.font = size + 'px "Press Start 2P", monospace'; c.fillStyle = col; c.textAlign = align; c.fillText(s, x, y); c.textAlign = 'left';
  }
  const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const lerp = (a, b, t) => a + (b - a) * t, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  /** Коефіцієнт перспективи для точки підлоги y (1 = біля меблів картинки). */
  const depthK = y => NX.room.scaleAt(Math.max(y, NX.cfg.FLOOR_Y)) / NX.cfg.NEXI_SCALE_FAR;
  /** Намалювати fn() збільшеним довкола точки (x,y) за перспективою. */
  function depth(c, x, y, fn) { const k = depthK(y); c.save(); c.translate(x, y); c.scale(k, k); c.translate(-x, -y); fn(k); c.restore(); }
  return { shade, rect, cube, glow, holo, stair, text, hash, lerp, clamp, depthK, depth };
})();

</script>
<script>
/* ---- js/core/camera.js ---- */
/* ============================================================================
 * core/camera.js — КАМЕРА, МАСШТАБ, ДОТИКИ
 * ----------------------------------------------------------------------------
 * Десктоп: кімната вміщується по ширині екрана (видно всю квартиру), а зайва
 * висота екрана стає добудованою стелею (зверху) і підлогою (знизу).
 * Телефон: кімната масштабується по висоті, а ширину гортаємо пальцем.
 * Тап (дотик без перетягування) передається в NX.input.onTap(x,y) у
 * координатах кімнати.
 * ========================================================================== */
NX.cam = {
  k: 1,          // скільки CSS-пікселів в 1 одиниці кімнати
  x: 0,          // лівий край видимої області (одиниці кімнати)
  top: 60,       // висота добудованої стелі
  front: 200,    // висота добудованої підлоги
  viewW: 1536,   // ширина видимої області (одиниці кімнати)
  mobile: false,
  dragUntil: 0,  // до якого часу камера не слідкує за Nexi (користувач гортав)

  /** Перерахунок під розмір вікна. Викликається на старті і при resize. */
  layout(vw, vh) {
    const C = NX.cfg;
    this.mobile = vw < 820 || vh > vw;
    if (!this.mobile) {
      this.k = vw / C.ROOM_W;                                   // вся кімната по ширині
      if (vh / this.k - C.ROOM_H < C.FRONT_MIN + C.TOP_MIN)     // дуже широкий екран
        this.k = vh / (C.ROOM_H + C.FRONT_MIN + C.TOP_MIN);
    } else {
      this.k = vh / (C.ROOM_H + 60 + 190);                      // телефон: по висоті
    }
    this.viewW = vw / this.k;
    const extra = vh / this.k - C.ROOM_H;                       // скільки треба добудувати
    this.top = Math.round(Math.max(C.TOP_MIN, Math.min(110, extra * .2)));
    this.front = Math.round(extra - this.top);
    this.x = NX.px.clamp(this.x, 0, Math.max(0, C.ROOM_W - this.viewW));
  },
  /** Камера м'яко тримає Nexi в центрі (якщо кімната ширша за екран). */
  follow(tx, dt) {
    if (performance.now() < this.dragUntil) return;
    const max = Math.max(0, NX.cfg.ROOM_W - this.viewW);
    const want = NX.px.clamp(tx - this.viewW / 2, 0, max);
    this.x += (want - this.x) * Math.min(1, dt * 3);
  },
  /** Екранні CSS-пікселі -> координати кімнати. */
  toRoom(sx, sy) { return [sx / this.k + this.x, sy / this.k - this.top]; },
  /** Координати кімнати -> екранні CSS-пікселі (для DOM-баблів). */
  toScreen(x, y) { return [(x - this.x) * this.k, (y + this.top) * this.k]; },

  /** Підключення перетягування (миша/палець) і тапів до canvas. */
  bindInput(canvas) {
    let down = null;
    canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, cx: this.x, moved: false }; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener('pointermove', e => {
      if (down) {
        const dx = e.clientX - down.x;
        if (Math.abs(dx) > 6) down.moved = true;
        if (down.moved) { const max = Math.max(0, NX.cfg.ROOM_W - this.viewW); this.x = NX.px.clamp(down.cx - dx / this.k, 0, max); this.dragUntil = performance.now() + 4000; }
      } else NX.input && NX.input.onHover(...this.toRoom(e.clientX, e.clientY));
    });
    canvas.addEventListener('pointerup', e => { if (down && !down.moved) NX.input.onTap(...this.toRoom(e.clientX, e.clientY)); down = null; });
    canvas.addEventListener('pointercancel', () => down = null);
  },
};

</script>
<script>
/* ---- js/core/loop.js ---- */
/* ============================================================================
 * core/loop.js — ГОЛОВНИЙ ЦИКЛ І ПОРЯДОК МАЛЮВАННЯ
 * ----------------------------------------------------------------------------
 * Кожен кадр:
 *   1) update(dt) усіх модулів (Nexi, кіт, об'єкти, частинки, UI)
 *   2) малювання шарами:
 *        стеля -> картинка кімнати -> "життя" фону (ambient)
 *        -> drawBack об'єктів (те, що завжди позаду персонажів)
 *        -> СОРТУВАННЯ ЗА ГЛИБИНОЮ: персонажі + drawFront об'єктів
 *           (хто нижче на екрані — той ближче і малюється пізніше)
 *        -> частинки -> підсвітка наведення
 * Об'єкт може віддати кілька "шарів" через layers(): [{y, draw}], тоді
 * частини одного меблю (сидіння і спинка крісла) правильно перекривають Nexi.
 * ========================================================================== */
NX.loop = {
  canvas: null, c: null, last: 0, dpr: 1,
  start() {
    this.canvas = document.getElementById('world');
    this.c = this.canvas.getContext('2d');
    this.resize(); addEventListener('resize', () => this.resize());
    NX.cam.bindInput(this.canvas);
    this.last = performance.now() / 1000;
    requestAnimationFrame(() => this.frame());
  },
  resize() {
    this.dpr = Math.min(2, devicePixelRatio || 1);
    const vw = innerWidth, vh = innerHeight;
    this.canvas.width = Math.round(vw * this.dpr); this.canvas.height = Math.round(vh * this.dpr);
    NX.cam.layout(vw, vh);
    NX.room.build();                           // перебудувати стелю/підлогу під новий розмір
    Object.values(NX.objects).forEach(o => o.layout && o.layout());
  },
  frame() {
    const now = performance.now() / 1000, dt = Math.min(.05, now - this.last); this.last = now; NX.time += dt;
    const t = NX.time, c = this.c;
    // ---- 1. логіка
    NX.nexi.update(dt, t); NX.cat.update(dt, t);
    Object.values(NX.objects).forEach(o => o.update && o.update(dt, t));
    NX.fx.update(dt); NX.ui.hud.update(dt, t);
    NX.cam.follow(NX.nexi.x, dt);
    // ---- 2. малювання
    const k = NX.cam.k * this.dpr;
    c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#050818'; c.fillRect(0, 0, this.canvas.width, this.canvas.height);
    c.setTransform(k, 0, 0, k, -NX.cam.x * k, NX.cam.top * k);
    c.imageSmoothingEnabled = false;
    NX.room.draw(c, t);
    NX.city.draw(c, t, dt);
    NX.ambient.draw(c, t);
    const objs = Object.values(NX.objects);
    objs.forEach(o => o.drawBack && o.drawBack(c, t));
    const list = [NX.nexi.layer(), NX.cat.layer()];
    objs.forEach(o => o.layers && list.push(...o.layers(t)));
    list.filter(Boolean).sort((a, b) => a.y - b.y).forEach(l => l.draw(c, t));
    NX.fx.draw(c);
    NX.input.drawHover(c, t);
    requestAnimationFrame(() => this.frame());
  },
};

</script>

<script>
/* ---- js/world/room.js ---- */
/* ============================================================================
 * world/room.js — КІМНАТА (робоча зона Nexi)
 * ----------------------------------------------------------------------------
 * Шари кімнати:
 *   1. assets/room.webp — головна картинка-кімната (1536×368). Це НЕ просто
 *      фон: на ній стоять точки взаємодії (core/config.js → POI), і Nexi
 *      ходить по її підлозі, сідає на її диван, злітає на її стіл.
 *   2. Стеля (y < 0) — добудовується кодом під висоту екрана.
 *   3. Передня підлога (y > 368) — продовження тієї ж глянцевої підлоги
 *      з віддзеркаленням кімнати. Це та сама підлога, ближча до глядача.
 * Межі, де можна ходити, повертає walkBounds().
 * ========================================================================== */
NX.room = {
  img: new Image(), ceil: null, front: null,
  load(src) { return new Promise(r => { this.img.onload = r; this.img.src = src; }); },

  /** Перебудова добудованих шарів (на старті та при зміні розміру вікна). */
  build() {
    const { ROOM_W: W, ROOM_H: H } = NX.cfg, { top, front } = NX.cam, P = NX.px;
    // ---------- стеля ----------
    this.ceil = document.createElement('canvas'); this.ceil.width = W; this.ceil.height = top + 2;
    let c = this.ceil.getContext('2d');
    let g = c.createLinearGradient(0, 0, 0, top); g.addColorStop(0, '#02030c'); g.addColorStop(1, '#0c1236'); c.fillStyle = g; c.fillRect(0, 0, W, top + 2);
    P.rect(c, 0, top - 12, W, 6, '#141c52'); P.rect(c, 0, top - 12, W, 1, '#2a3a8a');                 // балка
    for (let x = 24; x < W; x += 128) {                                                               // неонові трубки
      const col = (x / 128 | 0) % 2 ? '#d94bff' : '#3be8ff';
      P.rect(c, x + 30, 0, 1, top - 26, '#1a2260'); P.rect(c, x + 92, 0, 1, top - 26, '#1a2260');
      P.rect(c, x + 26, top - 27, 70, 3, col); P.glow(c, x + 61, top - 26, 40, col === '#3be8ff' ? 'rgba(59,232,255,.35)' : 'rgba(217,75,255,.35)');
    }
    for (let x = 80; x < W; x += 260) {                                                               // кабелі, що провисають
      c.strokeStyle = '#0f1640'; c.lineWidth = 2; c.beginPath(); c.moveTo(x, top - 6); c.quadraticCurveTo(x + 65, top + 4, x + 130, top - 6); c.stroke();
    }
    // ---------- передня підлога ----------
    this.front = document.createElement('canvas'); this.front.width = W; this.front.height = front + 2;
    c = this.front.getContext('2d');
    g = c.createLinearGradient(0, 0, 0, front); g.addColorStop(0, '#1a0e44'); g.addColorStop(1, '#05061a'); c.fillStyle = g; c.fillRect(0, 0, W, front + 2);
    const ref = Math.min(front, 220);                                                                 // віддзеркалення кімнати в глянцевій підлозі
    c.save(); c.globalAlpha = .30; c.translate(0, 0); c.scale(1, -1); c.drawImage(this.img, 0, H - ref, W, ref, 0, -ref, W, ref); c.restore();
    g = c.createLinearGradient(0, 0, 0, front); g.addColorStop(0, 'rgba(20,10,52,.10)'); g.addColorStop(.7, 'rgba(6,6,26,.92)'); g.addColorStop(1, 'rgba(4,5,20,1)'); c.fillStyle = g; c.fillRect(0, 0, W, front + 2);
    const vx = W / 2, vy = -340; c.lineWidth = 1;                                                     // перспективна сітка плитки
    for (let i = -16; i <= 16; i++) { const xb = vx + i * 120, xa = vx + (xb - vx) * (0 - vy) / (front - vy); c.strokeStyle = i % 2 ? 'rgba(217,75,255,.10)' : 'rgba(59,232,255,.10)'; c.beginPath(); c.moveTo(xa, 0); c.lineTo(xb, front); c.stroke(); }
    for (let k = 1; k < 12; k++) { const tt = k / 12; P.rect(c, 0, front * Math.pow(tt, 1.6), W, 1, `rgba(59,232,255,${.03 + .08 * tt})`); }
    for (let y = 0; y < front; y += 4) for (let x = (y / 4 % 2) * 4; x < W; x += 8) P.rect(c, x, y, 1, 1, 'rgba(140,120,255,.05)');  // 8-bit дизеринг
  },

  draw(c, t) {
    const { ROOM_H: H } = NX.cfg, { top } = NX.cam;
    c.drawImage(this.ceil, 0, -top);
    c.drawImage(this.img, 0, 0);
    const g = c.createLinearGradient(0, 0, 0, 22); g.addColorStop(0, 'rgba(12,18,54,.9)'); g.addColorStop(1, 'rgba(12,18,54,0)'); c.fillStyle = g; c.fillRect(0, 0, NX.cfg.ROOM_W, 22);
    c.drawImage(this.front, 0, H);
    // шов картинки й добудови — м'який неоновий відблиск, що "дихає"
    NX.px.rect(c, 0, H, NX.cfg.ROOM_W, 1, `rgba(217,75,255,${.25 + .1 * Math.sin(t * 1.5)})`);
  },

  /** Де можна ходити (прямокутник підлоги). */
  walkBounds() { return { minX: 26, maxX: NX.cfg.ROOM_W - 26, minY: NX.cfg.FLOOR_Y + 6, maxY: NX.cfg.ROOM_H + NX.cam.front - 24 }; },
  clampWalk(x, y) { const b = this.walkBounds(); return [NX.px.clamp(x, b.minX, b.maxX), NX.px.clamp(y, b.minY, b.maxY)]; },
  /** Масштаб персонажа залежно від глибини (y): далі — менший. */
  scaleAt(y) { const C = NX.cfg, t = NX.px.clamp((y - C.FLOOR_Y) / 330, 0, 1); return NX.px.lerp(C.NEXI_SCALE_FAR, C.NEXI_SCALE_NEAR, t); },
};

</script>
<script>
/* ---- js/world/ambient.js ---- */
/* ============================================================================
 * world/ambient.js — "ЖИТТЯ" ФОНУ (неінтерактивні анімації картинки)
 * ----------------------------------------------------------------------------
 * Тут усе, що оживляє саму картинку, але на що не можна натиснути:
 *   - вогні у вікнах міста та зорі
 *   - іскра на кільці планети, вогник корабля, летючий транспорт
 *   - світіння і скан-лінії на настінних екранах
 *   - мерехтіння ламп, пульс "мозку" на екрані AI-центру
 * Координати — у системі кімнати (див. core/config.js).
 * ========================================================================== */
NX.ambient = {
  windows: [],
  // Настінні екрани: [x, y, w, h, колір]
  screens: [[75, 50, 162, 170, '#3be8ff'], [332, 150, 128, 105, '#3be8ff'], [537, 170, 108, 90, '#d94bff'], [968, 22, 110, 118, '#3be8ff'], [1168, 165, 130, 135, '#3be8ff'], [730, 168, 98, 40, '#3be8ff']],
  lamps: [[515, 145], [660, 236], [1418, 92], [1243, 48], [1110, 222], [35, 255]],

  /** Знаходимо темні пікселі будівель у вікні, щоб "запалювати" в них вікна. */
  init() {
    const tc = document.createElement('canvas'); tc.width = 1536; tc.height = 368; const x = tc.getContext('2d', { willReadFrequently: true }); x.drawImage(NX.room.img, 0, 0);
    const d = x.getImageData(0, 0, 1536, 368).data, H = NX.px.hash;
    for (let k = 0; k < 8000 && this.windows.length < 180; k++) {
      const px = 470 + Math.floor(H(k) * 470), py = 70 + Math.floor(H(k + 999) * 170), i = (py * 1536 + px) * 4;
      if (d[i] + d[i + 1] + d[i + 2] < 130 && d[i + 2] > d[i]) this.windows.push([px, py, H(k + 7)]);

  },
  draw(c, t) {

    for (let i = 0; i < 28; i++) { const x = 480 + P.hash(i + 50) * 460, y = 8 + P.hash(i + 80) * 60, a = Math.sin(t * 1.7 + i * 2.1); if (a > .3) { P.rect(c, x, y, 1.5, 1.5, '#fff'); if (a > .9) { P.rect(c, x - 2, y + .25, 5.5, 1, '#fff'); P.rect(c, x + .25, y - 2, 1, 5.5, '#fff'); } } }
    // планета: іскри на кільці + пульс
    for (let k = 0; k < 2; k++) { const a = t * .7 + k * Math.PI, px = 752 + 132 * Math.cos(a), py = 64 + 26 * Math.sin(a) - Math.cos(a) * 14; P.glow(c, px, py, 9, 'rgba(160,240,255,.9)', .9); P.rect(c, px - 1, py - 1, 2.5, 2.5, '#fff'); }
    P.glow(c, 765, 62, 70, 'rgba(59,150,255,.5)', .25 + .1 * Math.sin(t));
    // корабель (вогник) і маленький летючий транспорт
    P.rect(c, 862, 61, 2.5, 2.5, Math.sin(t * 6) > 0 ? '#ff3b6a' : '#7af0ff');
    const fx = 470 + ((t / 9) % 1) * 480; P.rect(c, fx, 34, 10, 3, '#c9b4ff'); P.rect(c, fx + 3, 31, 4, 3, '#c9b4ff'); P.rect(c, fx - 3 + (Math.floor(t * 12) % 2), 35, 3, 1.5, '#ffe27a');
    // екрани: світіння + скан-лінія
    this.screens.forEach(([x, y, w, h, col], i) => { c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = .08 + .06 * Math.sin(t * 1.3 + i); c.fillStyle = col; c.fillRect(x, y, w, h); c.globalAlpha = .3; c.fillRect(x + 3, y + ((t * .35 + i * .17) % 1) * h, w - 6, 1); c.restore(); });
    P.glow(c, 165, 135, 45, 'rgba(255,120,240,.8)', .2 + .2 * Math.sin(t * 2.4));   // "мозок" AI-центру
    // табличка над столом (на картинці був нечитабельний напис) — тепер "AI CHAT" з іконкою
    P.rect(c, 331, 94, 56, 34, '#070b26'); c.strokeStyle = '#3be8ff'; c.lineWidth = 1; c.strokeRect(331.5, 94.5, 55, 33);
    P.rect(c, 337, 103, 12, 8, '#3be8ff'); P.rect(c, 339, 111, 3, 2, '#3be8ff'); P.rect(c, 339, 106, 2, 2, '#070b26'); P.rect(c, 343, 106, 2, 2, '#070b26');
    P.text(c, 'AI', 353, 108, '#ff7af0', 5); P.text(c, 'CHAT', 353, 117, '#3be8ff', 5); if (Math.sin(t * 3) > 0) P.rect(c, 380, 98, 3, 3, '#3bff8a');
    this.lamps.forEach(([x, y], i) => P.glow(c, x, y, 22, 'rgba(255,200,90,.9)', .28 + .18 * Math.sin(t * 3.1 + i * 2) + (P.hash(Math.floor(t * 8) + i) > .97 ? -.2 : 0)));
  },

<script>
/* ---- js/world/cityscape.js ---- */
/* ============================================================================
 * world/cityscape.js — ЖИТТЯ ЗА ВІКНОМ (місто живе своїм життям)
 * ----------------------------------------------------------------------------
 *   - три смуги летючих машин (різна швидкість, напрям, фари, сліди)
 *   - дирижабль з LED-стрічкою, що біжить
 *   - прожектори з землі, що повільно хитаються
 *   - падаючі зорі, рій дронів з вогниками
 *   - феєрверк: NX.city.fireworks(сек) — коли Nexi дивиться у вікно
 * Усе обрізається рамкою вікна; віконна стійка домальовується поверх.
 * ========================================================================== */
NX.city = {
  WIN: { x: 472, y: 0, w: 462, h: 168 }, MULLION: [594, 0, 14, 168],
  cars: [], fw: [], fwUntil: 0, star: null,
  init() {
    const lanes = [{ y: 96, sp: 46, dir: 1, s: 1 }, { y: 128, sp: 30, dir: -1, s: .8 }, { y: 160, sp: 64, dir: 1, s: 1.2 }];
    lanes.forEach((L, li) => { for (let i = 0; i < 4; i++) this.cars.push({ ...L, x: this.WIN.x + Math.random() * this.WIN.w, col: ['#ff7af0', '#3be8ff', '#ffc94d', '#c9b4ff'][(i + li) % 4] }); });
  },
  fireworks(sec) { this.fwUntil = NX.time + sec; },
  draw(c, t, dt) {
    const P = NX.px, W = this.WIN;
    c.save(); c.beginPath(); c.rect(W.x, W.y, W.w, W.h); c.clip();
    // прожектори
    c.save(); c.globalCompositeOperation = 'lighter';
    [[700, .4], [880, -.3]].forEach(([bx, ph], i) => { const a = -Math.PI / 2 + Math.sin(t * .4 + ph * 5) * .5, len = 200; const g = c.createLinearGradient(bx, 168, bx + Math.cos(a) * len, 168 + Math.sin(a) * len); g.addColorStop(0, 'rgba(160,200,255,.18)'); g.addColorStop(1, 'rgba(160,200,255,0)');
      c.fillStyle = g; c.beginPath(); c.moveTo(bx - 3, 168); c.lineTo(bx + Math.cos(a - .06) * len, 168 + Math.sin(a - .06) * len); c.lineTo(bx + Math.cos(a + .06) * len, 168 + Math.sin(a + .06) * len); c.lineTo(bx + 3, 168); c.fill(); });
    c.restore();
    // дирижабль з LED-стрічкою
    const zx = W.x + ((t * 9) % (W.w + 160)) - 80, zy = 48 + Math.sin(t * .5) * 3;
    c.fillStyle = '#3a2a6a'; c.beginPath(); c.ellipse(zx, zy, 34, 9, 0, 0, 7); c.fill(); c.fillStyle = '#5a4a9a'; c.beginPath(); c.ellipse(zx, zy - 3, 30, 4, 0, 0, 7); c.fill();
    P.rect(c, zx - 8, zy + 8, 16, 4, '#2a1c50'); P.rect(c, zx - 22, zy - 2, 44, 4, '#0a0a20');
    for (let i = 0; i < 22; i++) if ((i + Math.floor(t * 8)) % 6 < 3) P.rect(c, zx - 21 + i * 2, zy - 1, 1, 2, i % 4 < 2 ? '#ff4fd8' : '#3be8ff');
    P.rect(c, zx + 32, zy - 1, 2, 2, Math.sin(t * 5) > 0 ? '#ff3b3b' : '#550000');
    // летючі машини
    this.cars.forEach(car => { car.x += car.sp * car.dir * dt; if (car.dir > 0 && car.x > W.x + W.w + 20) car.x = W.x - 20; if (car.dir < 0 && car.x < W.x - 20) car.x = W.x + W.w + 20;
      const s = car.s, fx = car.dir > 0 ? car.x + 8 * s : car.x - 1;
      c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = .35; P.rect(c, car.dir > 0 ? car.x - 18 * s : car.x + 8 * s, car.y + 1.5 * s, 18 * s, 1, car.col); c.restore();
      P.rect(c, car.x, car.y, 8 * s, 3 * s, '#1a1d40'); P.rect(c, car.x + 2 * s, car.y - 1.5 * s, 4 * s, 2 * s, car.col); P.rect(c, fx, car.y + .5, 1.5, 1.5, '#fff6c0'); P.rect(c, car.dir > 0 ? car.x - 1 : car.x + 8 * s, car.y + .5, 1.5, 1.5, '#ff3b3b');
      P.glow(c, fx, car.y + 1, 6, 'rgba(255,240,180,.9)', .5); });
    // рій дронів
    for (let i = 0; i < 5; i++) { const dx = W.x + 60 + ((t * 14 + i * 9) % (W.w - 120)), dy = 140 - i * 4 + Math.sin(t * 2 + i) * 3; P.rect(c, dx, dy, 2, 1, '#9aa0c0'); if (Math.sin(t * 7 + i) > .3) P.rect(c, dx, dy - 1, 1, 1, '#ff3b3b'); }
    // падаюча зоря
    if (!this.star && Math.random() < dt * .15) this.star = { x: W.x + 60 + Math.random() * (W.w - 120), y: 6 + Math.random() * 30, t: 0 };
    if (this.star) { const s = this.star; s.t += dt; const k = s.t / .8; for (let i = 0; i < 10; i++) P.rect(c, s.x + k * 90 - i * 3, s.y + k * 40 - i * 1.3, 1.5, 1.5, `rgba(255,255,255,${(1 - i / 10) * (1 - k)})`); if (k >= 1) this.star = null; }
    // феєрверк
    if (NX.time < this.fwUntil && Math.random() < dt * 2.2) { const fx = W.x + 50 + Math.random() * (W.w - 100), fy = 30 + Math.random() * 70, col = ['#ff4fd8', '#3be8ff', '#ffc94d', '#7aff9a'][Math.random() * 4 | 0]; this.fw.push({ x: fx, y: fy, t: 0, col }); }
    this.fw = this.fw.filter(f => (f.t += dt) < 1.4); this.fw.forEach(f => { const r = 6 + f.t * 26; for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; c.globalAlpha = Math.max(0, 1 - f.t / 1.4); P.rect(c, f.x + Math.cos(a) * r, f.y + Math.sin(a) * r + f.t * f.t * 10, 1.5, 1.5, f.col); } c.globalAlpha = 1; P.glow(c, f.x, f.y, 20, 'rgba(255,255,255,.6)', Math.max(0, .6 - f.t)); });
    c.restore();
    const [mx, my, mw, mh] = this.MULLION; c.drawImage(NX.room.img, mx, my, mw, mh, mx, my, mw, mh);   // віконна стійка поверх
  },
};
/** Вікно як об'єкт: тап -> Nexi підходить і милується містом (феєрверк). */

<script>
/* ---- js/fx/particles.js ---- */
/* ============================================================================
 * fx/particles.js — СИСТЕМА ЧАСТИНОК
 * ----------------------------------------------------------------------------
 * Усі "живі" дрібниці: іскри, полум'я ранця, пара кави, серця кота, Zzz,
 * біти даних, ефекти скінів (дощ, сніг, вогонь...).
 *   NX.fx.emit(type, x, y, opts) — додати частинку
 *   NX.fx.skin(kind, x, y, s, moving, dir) — ефект обраного скіна навколо Nexi
 * Типи: 'spark','flame','steam','heart','z','bit','rain','snow','fire',
 *       'bubble','trail','energy','portal','dust','note'
 * ========================================================================== */
NX.fx = {
  list: [],
  emit(type, x, y, o = {}) {
    const r = Math.random;
    const base = { type, x, y, vx: 0, vy: 0, age: 0, ttl: 1, s: 1.5, col: '#fff' };
    const T = {
      spark:  { vx: (r() - .5) * 60, vy: -20 - r() * 50, g: 120, ttl: .5, col: r() < .5 ? '#ffe27a' : '#fff' },
      flame:  { vx: (r() - .5) * 10, vy: 40 + r() * 30, ttl: .25, s: 2, col: r() < .5 ? '#ffe27a' : '#ff7a2a' },
      steam:  { vx: (r() - .5) * 6, vy: -14, ttl: 1.6, s: 2, col: 'rgba(255,255,255,.6)' },
      heart:  { vx: (r() - .5) * 10, vy: -18, ttl: 1.6, s: 1, col: '#ff5ae0' },
      note:   { vx: (r() - .5) * 10, vy: -16, ttl: 1.6, s: 1, col: '#ffe27a' },
      z:      { vx: 6, vy: -10, ttl: 2.2, col: '#cfe6ff' },
      bit:    { ttl: .8, s: 1.5, col: r() < .5 ? '#3be8ff' : '#ff7af0' },
      rain:   { vx: -6, vy: 160, ttl: .45, s: 1, h: 5, col: '#6ab8ff' },
      snow:   { vx: (r() - .5) * 12, vy: 18, ttl: 3, s: 1.5, col: '#fff' },
      fire:   { vx: (r() - .5) * 14, vy: -40 - r() * 30, ttl: .6, s: 2, col: ['#ffe27a', '#ff9a3a', '#ff3b2e'][r() * 3 | 0] },
      bubble: { vx: (r() - .5) * 6, vy: -22, ttl: 1, s: 2, ring: 1, col: '#9ad8ff' },
      trail:  { ttl: .5, s: 4, col: r() < .5 ? '#7a5cff' : '#3be8ff' },
      energy: { vy: -70, ttl: .45, s: 1, h: 5, col: '#7af0ff' },
      portal: { ttl: .9, s: 1.5, col: r() < .5 ? '#d94bff' : '#3be8ff' },
      dust:   { vx: (r() - .5) * 16, vy: -6, ttl: .6, s: 1.5, col: 'rgba(200,180,255,.6)' },
    }[type] || {};
    this.list.push(Object.assign(base, T, o));
  },
  /** Ефект скіна "Ефекти" навколо бота. s — масштаб бота, H — його висота. */
  skin(kind, x, y, s, moving, dir) {
    const r = Math.random, H = 36 * s;
    if (kind === 'sparks' && r() < .4) this.emit('spark', x + (r() - .5) * H * .8, y - r() * H);
    if (kind === 'energy' && r() < .5) this.emit('energy', x + (r() - .5) * H * .7, y - r() * H * .6);
    if (kind === 'trail' && moving && r() < .8) this.emit('trail', x - dir * H * .25, y - r() * H * .7);
    if (kind === 'rain' && r() < .9) this.emit('rain', x + (r() - .5) * H * 1.4, y - H * 1.3);
    if (kind === 'snow' && r() < .4) this.emit('snow', x + (r() - .5) * H * 1.4, y - H * 1.3);
    if (kind === 'fire' && r() < .8) this.emit('fire', x + (r() - .5) * H * .5, y - 2);
    if (kind === 'water' && r() < .3) this.emit('bubble', x + (r() - .5) * H * .7, y - r() * H * .3);
  },
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const p = this.list[i]; p.age += dt; if (p.age > p.ttl) { this.list.splice(i, 1); continue; }
      if (p.g) p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.orbit) { const a = p.a0 + p.age * 4; p.x = p.cx + Math.cos(a) * p.orbit * (1 - p.age / p.ttl); p.y = p.cy + Math.sin(a) * p.orbit * .5 * (1 - p.age / p.ttl); }
    }
  },
  draw(c) {
    const P = NX.px;
    this.list.forEach(p => {
      c.globalAlpha = 1 - p.age / p.ttl;
      if (p.type === 'z') P.text(c, p.age > 1 ? 'Z' : 'z', p.x, p.y, p.col, 5);
      else if (p.type === 'heart') { const x = Math.round(p.x), y = Math.round(p.y); P.rect(c, x, y, 2, 2, p.col); P.rect(c, x + 3, y, 2, 2, p.col); P.rect(c, x, y + 1, 5, 2, p.col); P.rect(c, x + 1, y + 3, 3, 1, p.col); P.rect(c, x + 2, y + 4, 1, 1, p.col); }
      else if (p.type === 'note') { P.rect(c, p.x, p.y, 1, 5, p.col); P.rect(c, p.x - 2, p.y + 4, 3, 2, p.col); P.rect(c, p.x, p.y, 3, 1, p.col); }
      else if (p.ring) { c.strokeStyle = p.col; c.lineWidth = .7; c.strokeRect(p.x, p.y, p.s, p.s); }
      else P.rect(c, p.x, p.y, p.w || p.s, p.h || p.s, p.col);
    });
    c.globalAlpha = 1;
  },
};

/** Антени. (hX,hY) — лівий верх голови; ax/ay — пружне погойдування кінчика. */

    case 'premium': for (const s of [-1, 1]) { const b0 = s < 0 ? hX + 6 : hX + 23; line(b0, hY, b0 + s * 3 + ax, hY - 7 + ay, '#ffc94d', 2); line(b0 + s * 3 + ax, hY - 7 + ay, b0 + s * 2 + ax, hY - 11 + ay, '#ffe27a', 2); P(b0 + s * 2 + ax, hY - 12 + ay, 2, 2, '#3be8ff'); } break;

    case 'crown': BLK(hX + 8, hY - 6, 14, 6, 1, '#ffc94d'); [[hX + 8, 3], [hX + 14, 4], [hX + 20, 3]].forEach(([px, h]) => P(px, hY - 6 - h, 2, h, '#ffc94d')); P(hX + 11, hY - 4, 2, 2, '#ff3b6a'); P(hX + 17, hY - 4, 2, 2, '#3be8ff'); P(hX + 9, hY - 6, 12, 1, '#fff0a0'); break;

/** HSL -> #hex (для райдужної теми й RGB-антен). */
function hsl2hex(h, s, l) { const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)); return '#' + [f(0), f(8), f(4)].map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join(''); }

/* ---- js/actors/nexi/physics.js ---- */
/* ============================================================================
 * actors/nexi/physics.js — "ФІЗИКА" NEXI (пружини, нахил, стискання)
 * ----------------------------------------------------------------------------
 * Робить рухи живими, не змінюючи сам спрайт:
 *   lean  – нахил тіла в бік руху (розганяється / гальмує, як справжній)
 *   ax/ay – пружне погойдування кінчика антени (відстає від руху й тремтить)
 *   sq    – стискання/розтягування: присідає перед стрибком, "сплющується"
 *           при приземленні, а потім пружинить назад
 *   look  – куди дивляться очі (роззирається, коли нудьгує)
 * Значення передаються в позу (nexi.js -> layer()) і в трансформацію малювання.
 * ========================================================================== */
NX.phys = {
  /** Пружина: o[key] тягнеться до target зі швидкістю o[key+'V'] (k — жорсткість, damp — згасання). */
  spring(o, key, target, k, damp, dt) { const v = key + 'V'; o[v] = (o[v] || 0) + ((target - o[key]) * k - o[v] * damp) * dt; o[key] += o[v] * dt; },
};
NX.nexiPhys = {
  px: null, py: null, vx: 0, vy: 0, lean: 0, ax: 0, ay: 0, sq: 1,
  update(n, dt) {
    if (this.px === null) { this.px = n.x; this.py = n.y; }
    const d = Math.max(dt, 1e-3), ivx = (n.x - this.px) / d, ivy = (n.y - this.py) / d; this.px = n.x; this.py = n.y;
    this.vx += (ivx - this.vx) * Math.min(1, dt * 10); this.vy += (ivy - this.vy) * Math.min(1, dt * 10);
    const S = NX.phys.spring, C = NX.px.clamp;
    S(this, 'lean', C(this.vx / NX.cfg.RUN_SPEED * 10, -12, 12), 70, 10, dt);       // нахил у бік руху
    S(this, 'ax', C(-this.vx * .04, -4, 4), 110, 3.5, dt);                           // антена відстає і тремтить
    S(this, 'ay', C(this.vy * .025, -3, 3), 110, 4, dt);
    S(this, 'sq', 1, 190, 11, dt);                                                    // повернення форми
  },
  land(p = 3) { this.sqV = -p; },        // приземлення: сплющитись
  kick(p = 2.5) { this.sqV = p; },       // стрибок: витягнутись
};

<script>

/* ============================================================================
 * actors/cat/cat_sprite.js — МИЛИЙ РУДИЙ КІТ РУДИК (HD-сітка 32×24)

 * Мила стилістика: велика кругла голова, великі темні очі з двома бліками,
 * рожеві щічки, ротик "ω", пухнастий смугастий хвіст, білі шкарпетки.
 * Пози: walk, run, sit, happy (коли гладять), groom, sleep, eat, stretch,

 * ========================================================================== */

      const sw = Math.round(Math.sin(t * 3)); P(5, 21, 9, 2, C.O); P(4 + sw, 19, 3, 3, C.O); P(4 + sw, 19, 3, 1, C.D);          // хвіст навколо лап
      BUN(9, 10, 12, 13); P(12, 13, 6, 9, C.W); [10, 11].forEach(sx => P(sx, 12, 1, 3, C.D));
      paw(12, 19, 4); paw(16, 19, 4);

      head(10, 1, pose === 'groom' || pose === 'happy' ? 'happy' : pose === 'meow' ? 'meow' : blink);
      if (g) { P(19, 7, 3, 4, C.W); P(19, 7, 3, 1, C.L); }

      BUN(5, 12 + br, 20, 10 - br); [9, 12, 15, 18].forEach(sx => P(sx, 12 + br, 1, 3, C.D)); P(8, 20, 12, 1, C.W);

    }
    case 'eat': {
      tail(7, 12, Math.floor(t * 3) % 2);
      [9, 12, 17, 20].forEach(lx => paw(lx, 18, 5));

      P(3, 13, 5, 3, C.O); P(21, 12, 6, 3, C.O); P(25, 12, 2, 3, C.W); head(18, 1, 'open'); break;
    }
  }
  // темний теплий контур
  const id = x.getImageData(0, 0, CAT_W, CAT_H), d = id.data, op = new Uint8Array(CAT_W * CAT_H), o = C.OUT;
  for (let i = 0; i < op.length; i++) op[i] = d[i * 4 + 3] > 40 ? 1 : 0;
  for (let yy = 0; yy < CAT_H; yy++) for (let xx = 0; xx < CAT_W; xx++) { const i = yy * CAT_W + xx; if (op[i]) continue;

  x.putImageData(id, 0, 0); return cv;
}

<script>
/* ---- js/actors/nexi/nexi.js ---- */
/* ============================================================================
 * actors/nexi/nexi.js — NEXI: СТАН, ЧЕРГА ДІЙ, МАЛЮВАННЯ В КІМНАТІ
 * ----------------------------------------------------------------------------
 * Nexi виконує ЧЕРГУ ДІЙ (queue). Кожна дія — простий об'єкт:
 *   {walk:[x,y]}  іти по підлозі          {fly:[x,y]}  летіти на ранці
 *   {hop:[x,y]}   застрибнути/зістрибнути {face:±1}    повернутись
 *   {loc:'..'}    де він зараз (для виходу) {do:fn}    виконати функцію
 *   {say:'..'}    сказати фразу           {wait:сек}   почекати
 *   {work:{pose,dur,obj,start,end}}       працювати в позі з прогресом
 *   {fade:{alpha,zoom,y,dur}}             портал: зменшитись/зникнути
 *   {rot:градуси}                          лягти (поворот спрайта)
 * Сценарії (з якої дії складається "сісти на диван" тощо) — в activities.js.
 * Тут же автономне життя: якщо довго немає команд, Nexi сам щось робить.
 * ========================================================================== */
NX.nexi = {
  x: 768, y: 440, gy: 440, dir: 1, look: { ...DEFAULT_LOOK }, loc: 'dock',
  queue: [], cur: null, task: null, history: [], speak: null, talking: false,
  alpha: 1, zoom: 1, rot: 0, back: false, lastCmd: 0, mood: null, moodT: 0, temp: null, tempT: 0,
  catHungry: false, box: null, scr: document.createElement('canvas'),

  /* ---------------- КОМАНДИ ---------------- */
  /** Виконати сценарій з activities.js. byUser=false — це "вільний час". */
  do(id, byUser = true) {
    const A = NX.acts[id]; if (!A) return;
    if (byUser) this.lastCmd = NX.time;
    this.finishTask(false);
    this.queue = [...this.exitRoute(), ...A.route(this)]; this.cur = null;
    this.task = { id, title: NX.t('act.' + id + '.title'), color: A.color || '#3be8ff', steps: NX.t('act.' + id + '.steps') || [], prog: 0, auto: !byUser };
    NX.ui.hud.setActive(A.nav || null);
  },
  /** Просто піти в точку підлоги (тап по підлозі). */
  walkTo(x, y) { this.lastCmd = NX.time; this.finishTask(false); const [cx, cy] = NX.room.clampWalk(x, y); this.queue = [...this.exitRoute(), { walk: [cx, cy] }, { loc: 'floor' }]; this.cur = null; },
  /** Як "вийти" з поточного місця (злізти з дивану, злетіти зі столу...). */
  exitRoute() {
    const P = NX.cfg.POI, up = { do: () => { this.rot = 0; this.back = false; } };
    return ({
      aiDesk: [{ fly: P.aiDesk.floor }], chairA: [up, { hop: P.analytics.floor }], chairM: [up, { hop: P.marketing.floor }],
      sofaSit: [{ hop: P.sofa.floor }], sofaLie: [up, { hop: P.sofa.floor }], pad: [{ hop: P.workshop.floor }],
      hover: [up, { fly: P.tools.floor }], portalStep: [{ walk: P.portal.floor }],
      beanbag: [{ hop: [NX.objects.lounge.pos[0] + 30 * NX.px.depthK(NX.objects.lounge.pos[1]), NX.objects.lounge.pos[1] + 8] }],
    }[this.loc] || []).concat([{ loc: 'floor' }, up]);
  },
  finishTask(done) { if (this.task && done && !this.task.auto) this.history.push({ title: this.task.title, color: this.task.color }); if (this.history.length > 8) this.history.shift(); if (done || !this.queue.length) this.task = null; NX.objects && Object.values(NX.objects).forEach(o => { if ('active' in o && !done) o.active = false; }); },
  say(text) { this.speak = { text, t: 0 }; NX.ui.hud.bubble(text); NX.ui.chat && NX.ui.chat.add('b', text); },
  emote(m, d = 2.5) { this.mood = m; this.moodT = NX.time + d; },
  hitTest(x, y) { const b = this.box; return b && this.alpha > .3 && x > b[0] && x < b[0] + b[2] && y > b[1] && y < b[1] + b[3]; },

  /* ---------------- ВИКОНАННЯ ЧЕРГИ ---------------- */
  update(dt, t) {
    if (!this.cur && this.queue.length) { this.cur = this.queue.shift(); this.cur._t = 0; this.begin(this.cur); }
    if (this.cur) { this.cur._t += dt; if (this.step(this.cur, dt)) { this.end(this.cur); this.cur = null; } }
    if (!this.cur && !this.queue.length && this.task) { this.finishTask(true); }
    if (this.speak) { this.speak.t += dt; this.talking = this.speak.t < this.speak.text.length / 40; if (this.speak.t > this.speak.text.length / 40 + 3.2) { this.speak = null; this.talking = false; NX.ui.hud.bubble(null); } }
    this.autolife(t);
    NX.nexiPhys.update(this, dt);
    if (!this.cur && !this.queue.length && !this.talking && t > (this.nextIdle || 0) && this.loc !== 'sofaLie') { this.nextIdle = t + 5 + Math.random() * 5; const a = ['look', 'stretch', 'stand', 'look'][Math.random() * 4 | 0]; if (a !== 'stand') { this.temp = a; this.tempT = t + 2.6; } }
    if (this.cur && (this.cur.fly || this.pose === 'fly' || (this.cur.work && /hover/.test(this.cur.work.pose))) && Math.random() < .7) NX.fx.emit('flame', this.x + (Math.random() < .5 ? -9 : 9) * NX.room.scaleAt(this.y) / 1.45 * (this.dir), this.y + 2);
    if (this.look.fx && this.look.fx !== 'none' && this.alpha > .5) NX.fx.skin(this.look.fx, this.x, this.y, NX.room.scaleAt(Math.max(this.y, 352)), !!(this.cur && this.cur.walk), this.dir);
  },
  begin(a) {
    if (a.walk) { a.from = [this.x, this.y]; a.run = Math.hypot(a.walk[0] - this.x, a.walk[1] - this.y) > 500; }
    if (a.fly || a.hop) { a.from = [this.x, this.y]; const to = a.fly || a.hop; a.dur = a.hop ? .45 : Math.max(.5, Math.hypot(to[0] - this.x, to[1] - this.y) / NX.cfg.FLY_SPEED); if (a.fly) for (let i = 0; i < 6; i++) NX.fx.emit('dust', this.x, this.y); }
    if (a.face) this.dir = a.face;
    if (a.loc) this.loc = a.loc;
    if (a.do) a.do();
    if (a.say) this.say(a.say);
    if (a.rot !== undefined) this.rot = a.rot;
    if (a.fade) a.from = { alpha: this.alpha, zoom: this.zoom, y: this.y };
    if (a.work) { const w = a.work; if (w.back) this.back = true; if (w.obj) { NX.objects[w.obj].active = true; NX.objects[w.obj].prog = 0; } w.start && w.start(); }
  },
  step(a, dt) {
    if (a.walk) {
      const [tx, ty] = a.walk, dx = tx - this.x, dy = ty - this.y, d = Math.hypot(dx, dy), sp = (a.run ? NX.cfg.RUN_SPEED : NX.cfg.WALK_SPEED) * dt;
      this.pose = a.run ? 'run' : 'walk'; if (Math.abs(dx) > 1) this.dir = Math.sign(dx);
      if (d <= sp) { this.x = tx; this.y = ty; this.gy = ty; return true; } this.x += dx / d * sp; this.y += dy / d * sp; this.gy = this.y; return false;
    }
    if (a.spin) { this.dir = Math.floor(a._t * 12) % 2 ? 1 : -1; this.pose = 'spin'; if (a._t >= a.spin) { this.dir = 1; return true; } return false; }
    if (a.hop && a._t < .12) { this.pose = 'crouch'; return false; }                   // присід перед стрибком
    if (a.hop && !a.kicked) { a.kicked = true; NX.nexiPhys.kick(2.6); }
    if (a.fly || a.hop) {
      const to = a.fly || a.hop, k = Math.min(1, (a._t - (a.hop ? .12 : 0)) / a.dur);
      const e = a.hop ? k : (k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);   // плавний розгін/гальмування ранця
      this.x = NX.px.lerp(a.from[0], to[0], e); this.y = NX.px.lerp(a.from[1], to[1], e) - (a.hop ? Math.sin(k * Math.PI) * 14 : 0);
      this.pose = a.hop ? 'hop' : 'fly'; if (Math.abs(to[0] - a.from[0]) > 2) this.dir = Math.sign(to[0] - a.from[0]);
      if (k >= 1) NX.nexiPhys.land(a.hop ? 3.2 : 2.2);
      return k >= 1;
    }
    if (a.wait) { this.pose = 'stand'; return a._t >= a.wait; }
    if (a.fade) { const f = a.fade, k = Math.min(1, a._t / f.dur); if (f.spin) this.dir = Math.floor(a._t * 14) % 2 ? 1 : -1; this.alpha = NX.px.lerp(a.from.alpha, f.alpha, k); this.zoom = NX.px.lerp(a.from.zoom, f.zoom, k); if (f.y !== undefined) this.y = NX.px.lerp(a.from.y, f.y, k); this.pose = 'walk'; if (Math.random() < .6) NX.fx.list.push({ type: 'portal', x: this.x, y: this.y - 20, orbit: 26, cx: this.x, cy: this.y - 20, a0: Math.random() * 6.3, age: 0, ttl: .8, s: 1.5, col: Math.random() < .5 ? '#d94bff' : '#3be8ff', vx: 0, vy: 0 }); return k >= 1; }
    if (a.work) {
      const w = a.work; this.pose = w.pose; if (w.face) this.dir = w.face;
      const k = Math.min(1, a._t / w.dur); if (this.task) this.task.prog = k; if (w.obj) NX.objects[w.obj].prog = k;
      w.tick && w.tick(dt, k);
      return a._t >= w.dur;
    }
    return true;
  },
  end(a) { if (a.work) { const w = a.work; if (w.obj) { NX.objects[w.obj].active = false; NX.objects[w.obj].done = true; } w.end && w.end(); } },

  /* ---------------- ВІЛЬНИЙ ЧАС ---------------- */
  autolife(t) {
    if (this.cur || this.queue.length || NX.ui.skinlab.open) return;
    const idle = t - this.lastCmd;
    if (idle > NX.cfg.IDLE_BEFORE_SLEEP && this.loc !== 'sofaLie') { this.do('sleep', false); return; }
    if (idle > NX.cfg.IDLE_BEFORE_AUTOLIFE && t > (this.nextLife || 0) && this.loc !== 'sofaLie') {
      this.nextLife = t + 10 + Math.random() * 8;
      if (this.catHungry && NX.objects.catCorner.food < .2) { this.catHungry = false; this.do('feedCat', false); return; }
      const pool = ['sofa', 'coffee', 'petCat', 'dance', 'home', 'wander', 'fountain', 'beanbag', 'petCat', 'window', 'water', 'kickBall'];
      this.do(pool[Math.random() * pool.length | 0], false);
    }
  },

  /* ---------------- МАЛЮВАННЯ ---------------- */
  layer() {
    return { y: this.y, draw: (c, t) => {
      let pname = this.pose || 'stand';
      if (!this.cur && !this.queue.length) pname = this.talking ? 'talk' : (this.temp && t < this.tempT ? this.temp : (this.loc === 'sofaLie' ? 'sleep' : 'stand'));
      const p = poseFor(pname, t, !!(this.cur && this.cur.walk));
      if (this.back) p.back = 1; if (this.talking && !p.back && !p.talk) p.talk = 1;
      if (this.mood && t < this.moodT) p.face = { happy: 'happy', love: 'hearts', surprise: 'surprised', idea: 'think', sleepy: 'sleepy', sad: 'sad', angry: 'angry', cool: 'standard' }[this.mood];
      const ph = NX.nexiPhys; p.antX = ph.ax; p.antY = ph.ay; p.vel = NX.px.clamp(ph.vx / NX.cfg.RUN_SPEED, -1, 1); p.thrust = Math.min(1, Math.abs(ph.vy) / 80);
      renderBot(this.look, p, t, this.scr);
      const K = NX.cam.k * NX.loop.dpr, s = NX.room.scaleAt(Math.max(this.y, 352)) * this.zoom * SPRITE_K, w = SW * s, h = SH * s, top = FOOT * s;
      const X = Math.round(this.x * K) / K, Y = Math.round(this.y * K) / K;
      const shY = p.jet ? this.gy : Y, sr = s / SPRITE_K / 1.45;
      c.save(); c.globalAlpha = .45 * this.alpha * (p.jet ? .6 : 1); c.fillStyle = '#000'; c.beginPath(); c.ellipse(X, shY + 1, 11 * sr * (2 - ph.sq), 2.5 * sr, 0, 0, 7); c.fill(); c.restore();
      if (this.look.fx === 'aura') NX.px.glow(c, X, Y - top / 2, top * .8, 'rgba(140,100,255,.6)', this.alpha);
      c.save(); c.globalAlpha = this.alpha; c.imageSmoothingEnabled = false;
      c.translate(X, Y); c.rotate(((this.rot || 0) + (this.rot ? 0 : ph.lean)) * Math.PI / 180);
      c.scale((this.dir < 0 ? -1 : 1) * (1 + (1 - ph.sq) * .55), ph.sq);                 // стискання/розтяг
      c.drawImage(this.scr, -w / 2, -top, w, h); c.restore();
      if (this.look.fx === 'neon') { c.save(); c.globalAlpha = this.alpha; c.strokeStyle = Math.floor(t * 3) % 2 ? '#ff4fd8' : '#3be8ff'; c.lineWidth = 1.2; c.shadowColor = c.strokeStyle; c.shadowBlur = 8; c.strokeRect(X - w * .42, Y - top - 3, w * .84, top + 5); c.restore(); }
      if (this.mood && t < this.moodT) NX.px.text(c, { happy: '♪', love: '♥', surprise: '!', idea: '!?', sleepy: 'z', sad: '...', angry: '#!', cool: '*' }[this.mood], X + w * .3, Y - top - 4, '#ffe27a', 6);
      this.box = this.rot ? [X - top * .6, Y - w * .5, top * 1.2, w * .6] : [X - w * .4, Y - top, w * .8, top];
      this.headScreen = NX.cam.toScreen(X, Y - (this.rot ? w * .4 : top));
    } };
  },
};

        { do: () => { o.phase = 'idle'; NX.nexiPhys.land(4); } }, { say: NX.t('portal.res.' + d) }, { work: { pose: 'carry', dur: 3 } },

      { work: { pose: 'press', dur: 3.2, start: () => m.brew = .01 } }, { do: () => { m.brew = 0; m.cup = false; } }, { work: { pose: 'drink', dur: 5 } }]; } },

    wander: { color: '#3be8ff', route() { const b = NX.room.walkBounds(); return [{ walk: NX.room.clampWalk(80 + Math.random() * 1380, b.minY + Math.random() * (b.maxY - b.minY)) }, { work: { pose: 'look', dur: 3 } }]; } },

    beanbag: { color: '#d94bff', route() { const [x, y] = NX.objects.lounge.pos, k = NX.px.depthK(y); return [{ walk: [x + 30 * k, y + 8] }, { hop: [x, y - 22 * k] }, { loc: 'beanbag' }, { face: 1 }, line('beanbag'), { work: { pose: 'sitRead', dur: 11 } }]; } },

    fountain: { color: '#3be8ff', route() { const f = NX.objects.fountain, [x, y] = f.pos, k = NX.px.depthK(y); return [{ walk: [x - 50 * k, y + 6] }, { face: 1 }, line('fountain'),
      { work: { pose: 'toss', dur: .55 } }, { do: () => { NX.fx.emit('spark', NX.nexi.x + 8, NX.nexi.y - 40, { vx: 40 * k, vy: -50, g: 140, ttl: .8, col: '#ffc94d', s: 2.5 }); setTimeout(() => f.wish(), 700); } },
      { work: { pose: 'cheer', dur: 1.6 } }, { do: () => NX.nexi.emote('love') }]; } },

    window: { color: '#7a5cff', route() { return [{ walk: [705, 362] }, { face: 1 }, line('window'), { do: () => NX.city.fireworks(7) }, { work: { pose: 'gaze', dur: 7, back: true } }, { do: () => NX.nexi.emote('happy') }]; } },

    kickBall: { color: '#ff4fd8', route() { const b = NX.objects.catCorner.ball, side = b.x > 768 ? 1 : -1; return [{ walk: NX.room.clampWalk(b.x + side * 16, b.y) }, { face: -side }, line('kickBall'),
      { work: { pose: 'jump', dur: .35 } }, { do: () => { NX.objects.catCorner.kick(-side * 220, (Math.random() - .5) * 80); NX.nexiPhys.land(2); NX.cat.goTo(b.x, b.y, () => NX.cat.set('pounce', .5, () => NX.objects.catCorner.kick((Math.random() - .5) * 160, (Math.random() - .5) * 60)), null, true); } }, { work: { pose: 'cheer', dur: 1.5 } }]; } },

<script>
/* ---- js/actors/cat/cat.js ---- */
/* ============================================================================
 * actors/cat/cat.js — РУДИЙ КІТ: ВЛАСНЕ ЖИТТЯ (поведінка)
 * ----------------------------------------------------------------------------
 * Кіт живе сам: спить (лежанка / поличка / диван / килим), їсть і п'є з мисок,
 * вмивається, ганяє м'ячик, потягується, нявкає, приходить посидіти біля Nexi.
 * Голод росте з часом -> кіт іде до миски. Якщо миска порожня — нявкає,
 * і Nexi сам іде насипати корм (activities.js → feedCat).
 * Публічно: NX.cat.purr(сек) — коли Nexi гладить; NX.cat.hitTest(x,y).
 * Ще кіт п'є з фонтану і ганяє м'ячик, який штовхнув Nexi.
 * ========================================================================== */
NX.cat = {
  x: 80, y: 349, ground: 349, alt: 0, dir: 1, mode: 'act', pose: 'sleep', timer: 12, frame: 0, ft: 0,
  hunger: .2, target: null, then: null, jump: null, cv: document.createElement('canvas'), name: 'Рудик',
  spots() { const cc = NX.objects.catCorner; return {
    bed: { x: 80, y: 349 }, platform: { x: 78, y: 312, from: [78, 362] }, sofa: { x: 820, y: 320, from: [820, 364] },
    rug: { x: NX.objects.rug.home[0] + 70, y: NX.objects.rug.home[1] + 4 },
    beanbag: { x: NX.objects.lounge.pos[0] + 6, y: NX.objects.lounge.pos[1] - 26 * NX.px.depthK(NX.objects.lounge.pos[1]), from: [NX.objects.lounge.pos[0] + 6, NX.objects.lounge.pos[1] + 6] } }; },

  /** Наступна справа: вибір за потребами та випадком. */
  decide() {
    const cc = NX.objects.catCorner, r = Math.random();
    if (this.hunger > .7) { if (cc.food > .05) return this.goTo(cc.bowl[0] - 16, cc.bowl[1] + 1, () => this.set('eat', 5, () => { cc.food = Math.max(0, cc.food - .35); this.hunger = 0; })); return this.set('meow', 2.5, () => { NX.fx.emit('note', this.x, this.y - 22); NX.nexi.catHungry = true; }); }
    if (r < .25) { const keys = ['bed', 'platform', 'sofa', 'rug', 'beanbag', 'bed'], s = this.spots()[keys[Math.random() * keys.length | 0]]; return this.goTo(s.x, s.y, () => this.set('sleep', 14 + Math.random() * 14, () => this.set('stretch', 1.4)), s.from); }
    if (r < .4) return this.set('groom', 4 + Math.random() * 3);
    if (r < .58) { const b = cc.ball; return this.goTo(b.x - 12, b.y, () => { this.set('pounce', .5, () => { cc.kick((Math.random() - .3) * 160, (Math.random() - .5) * 60); }); }, null, true); }
    if (r < .64) return this.goTo(cc.water[0] - 14, cc.water[1] + 1, () => this.set('eat', 3));
    if (r < .7 && NX.objects.fountain) { const [fx, fy] = NX.objects.fountain.pos, k = NX.px.depthK(fy); return this.goTo(fx - 44 * k, fy + 2, () => this.set('eat', 3.5)); }
    if (r < .82) { const n = NX.nexi; return this.goTo(n.x + (Math.random() < .5 ? -28 : 28), Math.max(n.y, 362), () => this.set('sit', 6)); }
    const [wx, wy] = NX.room.clampWalk(60 + Math.random() * 1400, 362 + Math.random() * NX.cam.front * .7);
    return this.goTo(wx, wy, () => this.set('sit', 3));
  },
  set(pose, dur, done) { this.mode = 'act'; this.pose = pose; this.timer = dur; this.then = done || null; },
  /** Іти до точки (якщо ціль на висоті — спершу до точки під нею, потім стрибок). */
  goTo(x, y, done, from, run) {
    if (this.alt > 0) { const g = this.ground; this.alt = 0; return this.startJump(this.x + 8 * this.dir, g, () => this.goTo(x, y, done, from, run)); }   // спершу зістрибнути вниз
    this.mode = 'walk'; this.run = !!run; this.then = done;
    if (from) { this.target = { x: from[0], y: from[1] }; this.afterWalk = () => this.startJump(x, y, done); }
    else { this.target = { x, y }; this.afterWalk = null; }
  },
  startJump(x, y, done) { this.mode = 'jump'; this.jump = { x0: this.x, y0: this.y, x1: x, y1: y, t: 0 }; this.then = done; },
  purr(d) { this.set('happy', d, null); this.dir = NX.nexi.x > this.x ? 1 : -1; for (let i = 0; i < 4; i++) setTimeout(() => NX.fx.emit('heart', this.x, this.y - 24), i * 500); },
  hitTest(x, y) { const s = NX.room.scaleAt(Math.max(this.ground, 352)); return Math.abs(x - this.x) < 14 * s && y > this.y - 20 * s && y < this.y + 4; },

  update(dt, t) {
    this.hunger = Math.min(1, this.hunger + dt / 120);
    this.ft += dt; const sp = this.mode === 'walk' ? (this.run ? 80 : 34) : 0;
    if (this.ft > (this.run ? .08 : .14)) { this.ft = 0; this.frame++; }
    if (this.mode === 'walk') {
      const dx = this.target.x - this.x, dy = this.target.y - this.y, d = Math.hypot(dx, dy);
      this.pose = this.run ? 'run' : 'walk';
      if (d < 2) { this.x = this.target.x; this.y = this.target.y; this.ground = this.y; if (this.afterWalk) { const f = this.afterWalk; this.afterWalk = null; f(); } else { this.mode = 'act'; this.pose = 'sit'; this.timer = 0; } }
      else { this.x += dx / d * sp * dt; this.y += dy / d * sp * dt; this.ground = this.y; if (Math.abs(dx) > .5) this.dir = Math.sign(dx); }
    } else if (this.mode === 'jump') {
      const j = this.jump; j.t += dt / .5; const k = Math.min(1, j.t);
      this.x = NX.px.lerp(j.x0, j.x1, k); this.y = NX.px.lerp(j.y0, j.y1, k) - Math.sin(k * Math.PI) * 26; this.pose = 'pounce'; this.dir = Math.sign(j.x1 - j.x0) || this.dir;
      if (k >= 1) { this.y = j.y1; if (j.y1 >= 356) { this.ground = j.y1; this.alt = 0; } else { this.ground = j.y0; this.alt = j.y0 - j.y1; } this.mode = 'act'; this.pose = 'sit'; this.timer = 0; }
    } else {
      this.timer -= dt;
      if (this.pose === 'sleep' && Math.random() < dt * .4) NX.fx.emit('z', this.x + 6 * this.dir, this.y - 14);
      if (this.timer <= 0) { const f = this.then; this.then = null; if (f) f(); if (this.timer <= 0 && this.mode === 'act') this.decide(); }
    }
  },
  layer() {
    return { y: this.y + (this.alt > 0 ? 6 : 0), draw: c => {
      const s = NX.room.scaleAt(this.ground) * .82, w = CAT_W * s, h = CAT_H * s;   // .82 — кіт у пропорції до Nexi
      drawCat(this.pose, this.frame, NX.time, this.cv);
      c.save(); c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(this.x, this.y + 1, 9 * s, 2 * s, 0, 0, Math.PI * 2); c.fill();
      c.imageSmoothingEnabled = false; c.translate(this.x, 0); c.scale(this.dir, 1); c.drawImage(this.cv, -w / 2, this.y - h + s, w, h); c.restore();
    } };
  },
};

</script>

<script>
/* ---- js/ui/input.js ---- */
/* ============================================================================
 * ui/input.js — ДОТИКИ ТА КЛІКИ ПО КІМНАТІ
 * ----------------------------------------------------------------------------
 * Пріоритет тапу: Nexi (відкрити скіни) -> кіт (погладити) -> об'єкт кімнати
 * (виконати його сценарій act) -> підлога (просто піти туди).
 * Наведення мишею підсвічує об'єкт і показує його назву.
 * ========================================================================== */
NX.input = {
  hover: null, ripples: [],
  objectAt(x, y) {
    let best = null, area = 1e9;
    Object.values(NX.objects).forEach(o => { const h = o.hit; if (!h || !o.act) return; if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h && h.w * h.h < area) { best = o; area = h.w * h.h; } });
    return best;
  },
  onTap(x, y) {
    NX.ui.hud.firstTouch();
    if (NX.nexi.hitTest(x, y)) { NX.nexi.lastCmd = NX.time; if (NX.nexi.loc === 'sofaLie') { NX.nexi.emote('surprise'); NX.nexi.do('home'); } else { NX.nexi.temp = 'wave'; NX.nexi.tempT = NX.time + 2; NX.ui.skinlab.show(); } return; }
    if (NX.cat.hitTest(x, y)) { NX.fx.emit('note', NX.cat.x, NX.cat.y - 24); NX.nexi.do('petCat'); return; }
    for (const ob of Object.values(NX.objects)) if (ob.tapFirst && ob.tapFirst(x, y)) return;   // напр. меню порталу
    const o = this.objectAt(x, y); if (o) { if (o.onTap && o.onTap(x, y)) return; NX.nexi.do(o.act); return; }
    if (y > NX.cfg.FLOOR_Y - 4) { this.ripples.push({ x, y: NX.room.clampWalk(x, y)[1], t: 0 }); NX.nexi.walkTo(x, y); }
  },
  onHover(x, y) {
    const n = NX.nexi.hitTest(x, y) ? 'nexi' : NX.cat.hitTest(x, y) ? 'cat' : null;
    this.hover = n || this.objectAt(x, y);
    NX.loop.canvas.style.cursor = this.hover ? 'pointer' : 'default';
  },
  drawHover(c, t) {
    const P = NX.px;
    this.ripples = this.ripples.filter(r => (r.t += 1 / 60) < .8);
    this.ripples.forEach(r => { c.save(); c.globalAlpha = 1 - r.t / .8; c.strokeStyle = '#3be8ff'; c.lineWidth = 1.5; c.beginPath(); c.ellipse(r.x, r.y, 6 + r.t * 30, 2 + r.t * 8, 0, 0, 7); c.stroke(); c.restore(); });
    const h = this.hover; if (!h || typeof h === 'string') { if (h) { const lbl = NX.t(h === 'nexi' ? 'obj.nexiTag' : 'obj.catTag'), x = h === 'nexi' ? NX.nexi.x : NX.cat.x, y = (h === 'nexi' ? NX.nexi.box[1] : NX.cat.y - 30) - 6; this.tag(c, lbl, x, y); } return; }
    const b = h.hit; c.save(); c.strokeStyle = '#3be8ff'; c.lineWidth = 1.5; c.shadowColor = '#3be8ff'; c.shadowBlur = 10; c.globalAlpha = .7 + .3 * Math.sin(t * 6); c.strokeRect(b.x, b.y, b.w, b.h); c.restore();
    this.tag(c, NX.t(h.name).toUpperCase(), b.x + b.w / 2, b.y - 4);
  },
  tag(c, s, x, y) { const P = NX.px; c.font = '5px "Press Start 2P", monospace'; const w = c.measureText(s).width + 8; P.rect(c, x - w / 2, y - 9, w, 11, '#050818ee'); c.strokeStyle = '#3be8ff'; c.lineWidth = .8; c.strokeRect(x - w / 2, y - 9, w, 11); P.text(c, s, x, y - 1, '#3be8ff', 5, 'center'); },
};

</script>
<script>
/* ---- js/ui/hud.js ---- */
/* ============================================================================
 * ui/hud.js — МЕНЮ, ЧИП ЗАДАЧІ, БАБЛ NEXI, ПІДКАЗКА, ТОСТ
 * ----------------------------------------------------------------------------
 * HTML-елементи поверх canvas (розмітка в index.html, стилі в css/hud.css).
 * Меню: кожна кнопка запускає сценарій з actors/nexi/activities.js.
 * ========================================================================== */
NX.ui.hud = {
  NAV: ['home', 'ai', 'analytics', 'marketing', 'workshop', 'tools', 'portal'],
  $: id => document.getElementById(id), typed: null,
  init() {
    const nav = this.$('nav');
    this.NAV.forEach(id => { const b = document.createElement('button'); b.dataset.id = id; b.onclick = () => { this.firstTouch(); if (id === 'portal') NX.objects.portal.dest = NX.objects.portal.DESTS[Math.random() * 3 | 0]; NX.nexi.do(id); }; nav.appendChild(b); });
    this.$('skinbtn').onclick = () => NX.ui.skinlab.show();
    this.$('langbtn').onclick = () => { const L = NX.i18n.LANGS, i = L.indexOf(NX.i18n.lang); NX.i18n.set(L[(i + 1) % L.length]); };
    this.applyLang();
  },
  /** Перекласти весь HTML-інтерфейс поточною мовою (викликається і при зміні мови). */
  applyLang() {
    const $ = this.$, T = NX.t;
    document.querySelectorAll('nav button').forEach(b => b.textContent = T('nav.' + b.dataset.id));
    $('tagline').textContent = T('ui.tagline'); $('skinbtn').textContent = T('ui.skins'); $('langbtn').textContent = NX.i18n.LABEL[NX.i18n.lang]; $('langbtn').title = T('ui.lang');
    $('hint').textContent = T('ui.hint'); $('tg').textContent = T('ui.dialog'); $('q').placeholder = T('ui.ask'); $('labtitle').textContent = T('ui.labTitle');
    $('rnd').textContent = T('ui.random'); $('rst').textContent = T('ui.reset'); $('save').textContent = T('ui.save'); $('lx').setAttribute('aria-label', T('ui.close'));
    NX.ui.skinlab.CATS && NX.ui.skinlab.relabel(); NX.ui.chat.relabel && NX.ui.chat.relabel();
    if (NX.nexi.task) { const id = NX.nexi.task.id; NX.nexi.task.title = T('act.' + id + '.title'); NX.nexi.task.steps = T('act.' + id + '.steps'); }
  },
  setActive(id) { document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.id === id)); },
  firstTouch() { this.$('hint').style.display = 'none'; },
  toast(m) { const t = this.$('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(this._tt); this._tt = setTimeout(() => t.classList.remove('show'), 1800); },
  /** Показати/сховати бабл над Nexi (текст друкується по літері). */
  bubble(text) { const b = this.$('bub'); if (!text) { b.style.display = 'none'; this.typed = null; return; } this.typed = { text, t: 0 }; b.style.display = 'block'; },
  update(dt, t) {
    // бабл
    const b = this.$('bub');
    if (this.typed) {
      this.typed.t += dt; b.lastElementChild.textContent = this.typed.text.slice(0, Math.floor(this.typed.t * 40));
      const [sx, sy] = NX.nexi.headScreen || [0, 0], bw = b.offsetWidth, bh = b.offsetHeight, lab = NX.ui.skinlab.open ? this.$('lab').offsetWidth : 0;
      const L = Math.max(8, Math.min(innerWidth - bw - 8 - lab, sx - 40)); b.style.left = L + 'px'; b.style.top = Math.max(64, sy - bh - 14) + 'px'; b.style.setProperty('--tail', Math.max(10, Math.min(bw - 24, sx - L - 6)) + 'px');
    }
    // чип поточної задачі
    const k = NX.nexi.task, el = this.$('task');
    if (k) { el.style.display = 'flex'; el.style.borderColor = k.color; this.$('tk-n').textContent = NX.t(k.auto ? 'ui.free' : 'ui.task'); const st = Array.isArray(k.steps) && k.steps.length ? k.steps[Math.min(k.steps.length - 1, Math.floor(k.prog * k.steps.length))] : ''; this.$('tk-t').textContent = k.title + (st ? ' · ' + st : ''); this.$('tk-p').style.setProperty('--p', (k.prog * 100 | 0) + '%'); }
    else el.style.display = 'none';
  },
};

</script>
<script>
/* ---- js/ui/skinlab.js ---- */
/* ============================================================================
 * ui/skinlab.js — ЛАБОРАТОРІЯ СКІНІВ (відкривається тапом по Nexi або в Майстерні)
 * ----------------------------------------------------------------------------
 * Категорії беруться з actors/nexi/skins.js. Зміни одразу видно на Nexi
 * в кімнаті та на голограмі в Майстерні. "Зберегти" пише вибір у localStorage
 * (лише в цьому браузері).
 * ========================================================================== */
NX.ui.skinlab = {
  open: false, cat: null,
  init() {
    const $ = id => document.getElementById(id);
    this.CATS = [{ k: 'face', items: FACES }, { k: 'ant', items: ANTS }, { k: 'body', items: BODIES }, { k: 'arms', items: ARMS }, { k: 'legs', items: LEGS },
      { k: 'acc', items: ACCS }, { k: 'theme', items: THEMES }, { k: 'fx', items: FX }, { k: 'act', items: ACTIONS }, { k: 'mood', items: MOODS }];
    this.cat = this.CATS[0];
    this.CATS.forEach(c => { const b = document.createElement('button'); b.onclick = () => { this.cat = c; this.grid(); }; c.btn = b; $('cats').appendChild(b); });
    $('lx').onclick = () => this.hide(); addEventListener('keydown', e => { if (e.key === 'Escape') this.hide(); });
    $('pl').onclick = () => this.cycle(-1); $('pr').onclick = () => this.cycle(1);
    $('save').onclick = () => { try { localStorage.setItem('nexi-look', JSON.stringify(NX.nexi.look)); } catch (e) {} NX.ui.hud.toast('NEXI ЗБЕРЕЖЕНО'); NX.nexi.emote('love'); };
    $('rst').onclick = () => { NX.nexi.look = { ...DEFAULT_LOOK }; this.grid(); };
    $('rnd').onclick = () => { const p = o => { const k = Object.keys(o); return k[Math.random() * k.length | 0]; }, r = Math.random;
      NX.nexi.look = { face: p(FACES), ant: p(ANTS), body: p(BODIES), arms: p(ARMS), legs: p(LEGS), theme: p(THEMES), back: r() < .4 ? ['backpack', 'cape', 'wings'][r() * 3 | 0] : null, head: r() < .3 ? ['hood', 'hat', 'goggles', 'phones'][r() * 4 | 0] : null, hand: r() < .3 ? ['shield', 'sword'][r() * 2 | 0] : null, fx: r() < .5 ? p(FX) : 'none' };
      this.grid(); NX.nexi.emote('surprise', 1.5); };
    this.relabel();
    this.pv = $('pv').getContext('2d'); this.pscr = document.createElement('canvas'); this.tcr = document.createElement('canvas');
    const loop = () => { if (this.open) { const t = NX.time; renderBot(NX.nexi.look, poseFor(['stand', 'wave', 'dance', 'stand'][Math.floor(t / 2.5) % 4], t, false), t, this.pscr); this.pv.clearRect(0, 0, SW, SH); this.pv.drawImage(this.pscr, 0, 0); } requestAnimationFrame(loop); }; loop();
  },
  /** Назви категорій і скінів поточною мовою. */
  relabel() { this.CATS.forEach(c => c.btn.textContent = NX.t('cats.' + c.k)); if (this.open) this.grid(); },
  name(c, id) { return NX.t('skin.' + c.k + '.' + id); },
  show(fromWorkshop) { this.open = true; document.getElementById('lab').classList.add('open'); this.grid(); if (!fromWorkshop) NX.nexi.say(NX.pick('act.skinLab.lines')); },
  hide() { this.open = false; document.getElementById('lab').classList.remove('open'); },
  isOn(c, id) { const L = NX.nexi.look; if (c.k === 'acc') return L[ACCS[id].slot] === id; if (c.k === 'act' || c.k === 'mood') return false; return L[c.k] === id; },
  apply(c, id) {
    const n = NX.nexi, L = n.look; n.lastCmd = NX.time;
    if (c.k === 'acc') { const s = ACCS[id].slot; L[s] = L[s] === id ? null : id; }
    else if (c.k === 'act') { n.temp = id; n.tempT = NX.time + 4; }
    else if (c.k === 'mood') n.emote(id, 3);
    else L[c.k] = id;
    if (c.k !== 'act' && c.k !== 'mood') this.installFx();
    this.grid();
  },
  /** Ефект встановлення скіна: на платформі майстерні — маніпулятор, деінде — іскри. */
  installFx() {
    const n = NX.nexi; if (n.loc === 'pad') return NX.objects.workshop.install();
    for (let i = 0; i < 12; i++) NX.fx.emit('spark', n.x + (Math.random() - .5) * 30, n.y - Math.random() * 50); NX.nexiPhys.kick(2); n.emote('surprise', 1.2);
  },
  cycle(d) { const ks = Object.keys(this.cat.items), L = NX.nexi.look, cur = this.cat.k === 'acc' ? ks.findIndex(k => L[ACCS[k].slot] === k) : ks.indexOf(L[this.cat.k]); this.apply(this.cat, ks[(cur + d + ks.length) % ks.length]); },
  grid() {
    const g = document.getElementById('grid'), c = this.cat; this.CATS.forEach(x => x.btn.classList.toggle('on', x === c)); g.innerHTML = '';
    Object.keys(c.items).forEach(id => {
      const b = document.createElement('button'); b.className = 'tile' + (this.isOn(c, id) ? ' on' : ''); const cn = document.createElement('canvas'); cn.width = SW; cn.height = SH; b.append(cn, this.name(c, id));
      const l = { ...NX.nexi.look }; let po = poseFor('stand', 0, false);
      if (c.k === 'acc') l[ACCS[id].slot] = id; else if (c.k === 'act') po = poseFor(id, .3, false); else if (c.k === 'mood') po.face = { happy: 'happy', love: 'hearts', surprise: 'surprised', idea: 'think', sleepy: 'sleepy', sad: 'sad', angry: 'angry', cool: 'standard' }[id]; else l[c.k] = id;
      renderBot(l, po, .5, this.tcr); cn.getContext('2d').drawImage(this.tcr, 0, 0); b.onclick = () => this.apply(c, id); g.appendChild(b);
    });
  },
};

</script>
<script>
/* ---- js/ui/chat.js ---- */
/* ============================================================================
 * ui/chat.js — ДІАЛОГ З NEXI
 * ----------------------------------------------------------------------------
 * Поки що без справжнього AI: ключові слова (усіма 4 мовами) запускають
 * потрібний сценарій. Тут же швидкі кнопки-команди.
 * Пізніше сюди підключається бекенд з мовною моделлю (метод reply()).
 * ========================================================================== */
NX.ui.chat = {
  QUICK: [['report', 'analytics'], ['post', 'marketing'], ['integr', 'tools'], ['coffee', 'coffee'], ['cat', 'petCat'], ['skin', 'skin']],
  /** Ключові слова всіх 4 мов разом (js/i18n/*.js -> kw), щоб розуміти будь-якою. */
  kw() { const out = {}; Object.values(NX.i18n.dict).forEach(d => Object.entries(d.kw || {}).forEach(([k, v]) => { out[k] = out[k] ? out[k] + '|' + v : v; })); return Object.entries(out).map(([k, v]) => [k, new RegExp(v, 'i')]); },
  init() {
    const $ = id => document.getElementById(id);
    $('tg').onclick = () => $('panel').classList.toggle('open');
    this.QUICK.forEach(([n, id]) => { const b = document.createElement('button'); b.dataset.k = n; b.onclick = () => { this.add('u', b.textContent); id === 'skin' ? NX.ui.skinlab.show() : NX.nexi.do(id); }; $('chips').appendChild(b); });
    this.relabel();
    $('ask').onsubmit = e => { e.preventDefault(); const v = $('q').value.trim(); if (!v) return; $('q').value = ''; this.add('u', v); this.reply(v); };
  },
  relabel() { document.querySelectorAll('#chips button').forEach(b => b.textContent = NX.t('chat.quick.' + b.dataset.k)); },
  reply(v) {
    const m = this.kw().find(k => k[1].test(v)); if (m) return m[0] === 'skin' ? NX.ui.skinlab.show() : NX.nexi.do(m[0]);
    NX.nexi.lastCmd = NX.time; NX.nexi.temp = 'think'; NX.nexi.tempT = NX.time + 3;
    NX.nexi.say(NX.t('chat.fallback'));
  },
  add(c, t) { const log = document.getElementById('log'), d = document.createElement('div'); d.className = c; d.textContent = t; log.appendChild(d); log.scrollTop = log.scrollHeight; while (log.children.length > 40) log.firstChild.remove(); },
};

</script>
<script>
/* ---- js/main.js ---- */
/* ============================================================================
 * main.js — ЗАПУСК
 * Порядок: завантажити картинку кімнати -> підготувати "життя" фону ->
 * відновити збережений скін -> інтерфейс -> головний цикл -> привітання.
 * ========================================================================== */
(async () => {
  await NX.room.load(window.NX_ROOM_SRC || 'assets/room.webp');
  NX.i18n.lang = NX.i18n.detect(); document.documentElement.lang = NX.i18n.lang;   // мова телефону / збережена
  NX.ambient.init(); NX.city.init();
  try { Object.assign(NX.nexi.look, JSON.parse(localStorage.getItem('nexi-look') || '{}')); } catch (e) {}
  NX.ui.skinlab.init(); NX.ui.chat.init(); NX.ui.hud.init();
  NX.loop.start();
  [NX.nexi.x, NX.nexi.y] = NX.objects.rug.home; NX.nexi.gy = NX.nexi.y;
  NX.ui.chat.add('b', NX.t('chat.greet'));
  setTimeout(() => NX.nexi.do('home', false), 600);
})();

</script>

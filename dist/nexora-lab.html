  objectAt(x, y) {
    let best = null, area = 1e9;
    Object.values(NX.objects).forEach(o => { const h = o.hit; if (!h || !o.act) return; if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h && h.w * h.h < area) { best = o; area = h.w * h.h; } });
    return best;
  },
  onTap(x, y) {
    NX.ui.hud.firstTouch();
    if (NX.nexi.hitTest(x, y)) { NX.nexi.lastCmd = NX.time; if (NX.nexi.loc === 'sofaLie') { NX.nexi.emote('surprise'); NX.nexi.do('home'); } else { NX.nexi.temp = 'wave'; NX.nexi.tempT = NX.time + 2; NX.ui.skinlab.show(); } return; }
    if (NX.cat.hitTest(x, y)) { NX.fx.emit('note', NX.cat.x, NX.cat.y - 24); NX.nexi.do('petCat'); return; }
    for (const ob of Object.values(NX.objects)) if (ob.tapFirst && ob.tapFirst(x, y)) return;   // напр. меню порталу
    const o = this.objectAt(x, y); if (o) { if (o.onTap && o.onTap(x, y)) return; NX.nexi.do(o.act); return; }
    if (y > NX.cfg.FLOOR_Y - 4) { this.ripples.push({ x, y: NX.room.clampWalk(x, y)[1], t: 0 }); NX.nexi.walkTo(x, y); }
  },
  onHover(x, y) {
    const n = NX.nexi.hitTest(x, y) ? 'nexi' : NX.cat.hitTest(x, y) ? 'cat' : null;
    this.hover = n || this.objectAt(x, y);
    NX.loop.canvas.style.cursor = this.hover ? 'pointer' : 'default';
  },
  drawHover(c, t) {
    const P = NX.px;
    this.ripples = this.ripples.filter(r => (r.t += 1 / 60) < .8);
    this.ripples.forEach(r => { c.save(); c.globalAlpha = 1 - r.t / .8; c.strokeStyle = '#3be8ff'; c.lineWidth = 1.5; c.beginPath(); c.ellipse(r.x, r.y, 6 + r.t * 30, 2 + r.t * 8, 0, 0, 7); c.stroke(); c.restore(); });
    const h = this.hover; if (!h || typeof h === 'string') { if (h) { const lbl = NX.t(h === 'nexi' ? 'obj.nexiTag' : 'obj.catTag'), x = h === 'nexi' ? NX.nexi.x : NX.cat.x, y = (h === 'nexi' ? NX.nexi.box[1] : NX.cat.y - 30) - 6; this.tag(c, lbl, x, y); } return; }
    const b = h.hit; c.save(); c.strokeStyle = '#3be8ff'; c.lineWidth = 1.5; c.shadowColor = '#3be8ff'; c.shadowBlur = 10; c.globalAlpha = .7 + .3 * Math.sin(t * 6); c.strokeRect(b.x, b.y, b.w, b.h); c.restore();
    this.tag(c, NX.t(h.name).toUpperCase(), b.x + b.w / 2, b.y - 4);
  },
  tag(c, s, x, y) { const P = NX.px; c.font = '5px "Press Start 2P", monospace'; const w = c.measureText(s).width + 8; P.rect(c, x - w / 2, y - 9, w, 11, '#050818ee'); c.strokeStyle = '#3be8ff'; c.lineWidth = .8; c.strokeRect(x - w / 2, y - 9, w, 11); P.text(c, s, x, y - 1, '#3be8ff', 5, 'center'); },
};

</script>
<script>
/* ---- js/ui/hud.js ---- */
/* ============================================================================
 * ui/hud.js — МЕНЮ, ЧИП ЗАДАЧІ, БАБЛ NEXI, ПІДКАЗКА, ТОСТ
 * ----------------------------------------------------------------------------
 * HTML-елементи поверх canvas (розмітка в index.html, стилі в css/hud.css).
 * Меню: кожна кнопка запускає сценарій з actors/nexi/activities.js.
 * ========================================================================== */
NX.ui.hud = {
  NAV: ['home', 'ai', 'analytics', 'marketing', 'workshop', 'tools', 'portal'],
  $: id => document.getElementById(id), typed: null,
  init() {
    const nav = this.$('nav');
    this.NAV.forEach(id => { const b = document.createElement('button'); b.dataset.id = id; b.onclick = () => { this.firstTouch(); if (id === 'portal') NX.objects.portal.dest = NX.objects.portal.DESTS[Math.random() * 3 | 0]; NX.nexi.do(id); }; nav.appendChild(b); });
    this.$('skinbtn').onclick = () => NX.ui.skinlab.show();
    this.applyLang();
  },
  /** Перекласти весь HTML-інтерфейс поточною мовою (викликається і при зміні мови). */
  applyLang() {
    const $ = this.$, T = NX.t;
    document.querySelectorAll('nav button').forEach(b => b.textContent = T('nav.' + b.dataset.id));
    $('tagline').textContent = T('ui.tagline'); $('skinbtn').textContent = T('ui.skins');
    $('hint').textContent = T('ui.hint'); $('tg').textContent = T('ui.dialog'); $('q').placeholder = T('ui.ask'); $('labtitle').textContent = T('ui.labTitle');
    $('rnd').textContent = T('ui.random'); $('rst').textContent = T('ui.reset'); $('save').textContent = T('ui.save'); $('lx').setAttribute('aria-label', T('ui.close'));
    NX.ui.skinlab.CATS && NX.ui.skinlab.relabel(); NX.ui.chat.relabel && NX.ui.chat.relabel();
    if (NX.nexi.task) { const id = NX.nexi.task.id; NX.nexi.task.title = T('act.' + id + '.title'); NX.nexi.task.steps = T('act.' + id + '.steps'); }
  },
  setActive(id) { document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.id === id)); },
  firstTouch() { this.$('hint').style.display = 'none'; },
  toast(m) { const t = this.$('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(this._tt); this._tt = setTimeout(() => t.classList.remove('show'), 1800); },
  /** Показати/сховати бабл над Nexi (текст друкується по літері). */
  bubble(text) { const b = this.$('bub'); if (!text) { b.style.display = 'none'; this.typed = null; return; } this.typed = { text, t: 0 }; b.style.display = 'block'; },
  update(dt, t) {
    // бабл
    const b = this.$('bub');
    if (this.typed) {
      this.typed.t += dt; b.lastElementChild.textContent = this.typed.text.slice(0, Math.floor(this.typed.t * 40));
      const [sx, sy] = NX.nexi.headScreen || [0, 0], bw = b.offsetWidth, bh = b.offsetHeight, lab = NX.ui.skinlab.open ? this.$('lab').offsetWidth : 0;
      const L = Math.max(8, Math.min(innerWidth - bw - 8 - lab, sx - 40)); b.style.left = L + 'px'; b.style.top = Math.max(64, sy - bh - 14) + 'px'; b.style.setProperty('--tail', Math.max(10, Math.min(bw - 24, sx - L - 6)) + 'px');
    }
    // чип поточної задачі
    const k = NX.nexi.task, el = this.$('task');
    if (k) { el.style.display = 'flex'; el.style.borderColor = k.color; this.$('tk-n').textContent = NX.t(k.auto ? 'ui.free' : 'ui.task'); const st = Array.isArray(k.steps) && k.steps.length ? k.steps[Math.min(k.steps.length - 1, Math.floor(k.prog * k.steps.length))] : ''; this.$('tk-t').textContent = k.title + (st ? ' · ' + st : ''); this.$('tk-p').style.setProperty('--p', (k.prog * 100 | 0) + '%'); }
    else el.style.display = 'none';
  },
};

</script>
<script>
/* ---- js/ui/skinlab.js ---- */
/* ============================================================================
 * ui/skinlab.js — ЛАБОРАТОРІЯ СКІНІВ (відкривається тапом по Nexi або в Майстерні)
 * ----------------------------------------------------------------------------
 * Категорії беруться з actors/nexi/skins.js. Зміни одразу видно на Nexi
 * в кімнаті та на голограмі в Майстерні. "Зберегти" пише вибір у localStorage
 * (лише в цьому браузері).
 * ========================================================================== */
NX.ui.skinlab = {
  open: false, cat: null,
  init() {
    const $ = id => document.getElementById(id);
    this.CATS = [{ k: 'face', items: FACES }, { k: 'ant', items: ANTS }, { k: 'body', items: BODIES }, { k: 'arms', items: ARMS }, { k: 'legs', items: LEGS },
      { k: 'acc', items: ACCS }, { k: 'theme', items: THEMES }, { k: 'fx', items: FX }, { k: 'act', items: ACTIONS }, { k: 'mood', items: MOODS }];
    this.cat = this.CATS[0];
    this.CATS.forEach(c => { const b = document.createElement('button'); b.onclick = () => { this.cat = c; this.grid(); }; c.btn = b; $('cats').appendChild(b); });
    $('lx').onclick = () => this.hide(); addEventListener('keydown', e => { if (e.key === 'Escape') this.hide(); });
    $('pl').onclick = () => this.cycle(-1); $('pr').onclick = () => this.cycle(1);
    $('save').onclick = () => { try { localStorage.setItem('nexi-look', JSON.stringify(NX.nexi.look)); } catch (e) {} NX.ui.hud.toast('NEXI ЗБЕРЕЖЕНО'); NX.nexi.emote('love'); };
    $('rst').onclick = () => { NX.nexi.look = { ...DEFAULT_LOOK }; this.grid(); };
    $('rnd').onclick = () => { const p = o => { const k = Object.keys(o); return k[Math.random() * k.length | 0]; }, r = Math.random;
      NX.nexi.look = { face: p(FACES), ant: p(ANTS), body: p(BODIES), arms: p(ARMS), legs: p(LEGS), theme: p(THEMES), back: r() < .4 ? ['backpack', 'cape', 'wings'][r() * 3 | 0] : null, head: r() < .3 ? ['hood', 'hat', 'goggles', 'phones'][r() * 4 | 0] : null, hand: r() < .3 ? ['shield', 'sword'][r() * 2 | 0] : null, fx: r() < .5 ? p(FX) : 'none' };
      this.grid(); NX.nexi.emote('surprise', 1.5); };
    this.relabel();
    this.pv = $('pv').getContext('2d'); this.pscr = document.createElement('canvas'); this.tcr = document.createElement('canvas');
    const loop = () => { if (this.open) { const t = NX.time; renderBot(NX.nexi.look, poseFor(['stand', 'wave', 'dance', 'stand'][Math.floor(t / 2.5) % 4], t, false), t, this.pscr); this.pv.clearRect(0, 0, SW, SH); this.pv.drawImage(this.pscr, 0, 0); } requestAnimationFrame(loop); }; loop();
  },
  /** Назви категорій і скінів поточною мовою. */
  relabel() { this.CATS.forEach(c => c.btn.textContent = NX.t('cats.' + c.k)); if (this.open) this.grid(); },
  name(c, id) { return NX.t('skin.' + c.k + '.' + id); },
  show(fromWorkshop) { this.open = true; document.getElementById('lab').classList.add('open'); this.grid(); if (!fromWorkshop) NX.nexi.say(NX.pick('act.skinLab.lines')); },
  hide() { this.open = false; document.getElementById('lab').classList.remove('open'); },
  isOn(c, id) { const L = NX.nexi.look; if (c.k === 'acc') return L[ACCS[id].slot] === id; if (c.k === 'act' || c.k === 'mood') return false; return L[c.k] === id; },
  apply(c, id) {
    const n = NX.nexi, L = n.look; n.lastCmd = NX.time;
    if (c.k === 'acc') { const s = ACCS[id].slot; L[s] = L[s] === id ? null : id; }
    else if (c.k === 'act') { n.temp = id; n.tempT = NX.time + 4; }
    else if (c.k === 'mood') n.emote(id, 3);
    else L[c.k] = id;
    if (c.k !== 'act' && c.k !== 'mood') this.installFx();
    this.grid();
  },
  /** Ефект встановлення скіна: на платформі майстерні — маніпулятор, деінде — іскри. */
  installFx() {
    const n = NX.nexi; if (n.loc === 'pad') return NX.objects.workshop.install();
    for (let i = 0; i < 12; i++) NX.fx.emit('spark', n.x + (Math.random() - .5) * 30, n.y - Math.random() * 50); NX.nexiPhys.kick(2); n.emote('surprise', 1.2);
  },
  cycle(d) { const ks = Object.keys(this.cat.items), L = NX.nexi.look, cur = this.cat.k === 'acc' ? ks.findIndex(k => L[ACCS[k].slot] === k) : ks.indexOf(L[this.cat.k]); this.apply(this.cat, ks[(cur + d + ks.length) % ks.length]); },
  grid() {
    const g = document.getElementById('grid'), c = this.cat; this.CATS.forEach(x => x.btn.classList.toggle('on', x === c)); g.innerHTML = '';
    Object.keys(c.items).forEach(id => {
      const b = document.createElement('button'); b.className = 'tile' + (this.isOn(c, id) ? ' on' : ''); const cn = document.createElement('canvas'); cn.width = SW; cn.height = SH; b.append(cn, this.name(c, id));
      const l = { ...NX.nexi.look }; let po = poseFor('stand', 0, false);
      if (c.k === 'acc') l[ACCS[id].slot] = id; else if (c.k === 'act') po = poseFor(id, .3, false); else if (c.k === 'mood') po.face = { happy: 'happy', love: 'hearts', surprise: 'surprised', idea: 'think', sleepy: 'sleepy', sad: 'sad', angry: 'angry', cool: 'standard' }[id]; else l[c.k] = id;
      renderBot(l, po, .5, this.tcr); cn.getContext('2d').drawImage(this.tcr, 0, 0); b.onclick = () => this.apply(c, id); g.appendChild(b);
    });
  },
};

</script>
<script>
/* ---- js/ui/chat.js ---- */
/* ============================================================================
 * ui/chat.js — ДІАЛОГ З NEXI
 * ----------------------------------------------------------------------------
 * Поки що без справжнього AI: ключові слова (усіма 4 мовами) запускають
 * потрібний сценарій. Тут же швидкі кнопки-команди.
 * Пізніше сюди підключається бекенд з мовною моделлю (метод reply()).
 * ========================================================================== */
NX.ui.chat = {
  QUICK: [['report', 'analytics'], ['post', 'marketing'], ['integr', 'tools'], ['coffee', 'coffee'], ['cat', 'petCat'], ['skin', 'skin']],
  /** Ключові слова всіх 4 мов разом (js/i18n/*.js -> kw), щоб розуміти будь-якою. */
  kw() { const out = {}; Object.values(NX.i18n.dict).forEach(d => Object.entries(d.kw || {}).forEach(([k, v]) => { out[k] = out[k] ? out[k] + '|' + v : v; })); return Object.entries(out).map(([k, v]) => [k, new RegExp(v, 'i')]); },
  init() {
    const $ = id => document.getElementById(id);
    $('tg').onclick = () => $('panel').classList.toggle('open');
    this.QUICK.forEach(([n, id]) => { const b = document.createElement('button'); b.dataset.k = n; b.onclick = () => { this.add('u', b.textContent); id === 'skin' ? NX.ui.skinlab.show() : NX.nexi.do(id); }; $('chips').appendChild(b); });
    this.relabel();
    $('ask').onsubmit = e => { e.preventDefault(); const v = $('q').value.trim(); if (!v) return; $('q').value = ''; this.add('u', v); this.reply(v); };
  },
  relabel() { document.querySelectorAll('#chips button').forEach(b => b.textContent = NX.t('chat.quick.' + b.dataset.k)); },
  reply(v) {
    const m = this.kw().find(k => k[1].test(v)); if (m) return m[0] === 'skin' ? NX.ui.skinlab.show() : NX.nexi.do(m[0]);
    NX.nexi.lastCmd = NX.time; NX.nexi.temp = 'think'; NX.nexi.tempT = NX.time + 3;
    NX.nexi.say(NX.t('chat.fallback'));
  },
  add(c, t) { const log = document.getElementById('log'), d = document.createElement('div'); d.className = c; d.textContent = t; log.appendChild(d); log.scrollTop = log.scrollHeight; while (log.children.length > 40) log.firstChild.remove(); },
};

</script>
<script>
/* ---- js/main.js ---- */
/* ============================================================================
 * main.js — ЗАПУСК
 * Порядок: завантажити картинку кімнати -> підготувати "життя" фону ->
 * відновити збережений скін -> інтерфейс -> головний цикл -> привітання.
 * ========================================================================== */
(async () => {
  await NX.room.load(window.NX_ROOM_SRC || 'assets/room.webp');
  NX.i18n.lang = NX.i18n.detect(); document.documentElement.lang = NX.i18n.lang;   // мова телефону / збережена
  NX.ambient.init(); NX.city.init();
  try { Object.assign(NX.nexi.look, JSON.parse(localStorage.getItem('nexi-look') || '{}')); } catch (e) {}
  NX.ui.skinlab.init(); NX.ui.chat.init(); NX.ui.hud.init();
  NX.loop.start();
  [NX.nexi.x, NX.nexi.y] = NX.objects.home.home; NX.nexi.gy = NX.nexi.y;
  NX.ui.chat.add('b', NX.t('chat.greet'));
  setTimeout(() => NX.nexi.do('home', false), 600);
})();

</script>

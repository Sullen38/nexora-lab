<!doctype html>
<!-- =============================================================================
  index.html — КАРКАС СТОРІНКИ NEXORA AI · ЛАБОРАТОРІЯ NEXI
  1) ВІТАЛЬНА ЗАСТАВКА (#splash) — розмітка, стилі й перший скрипт прямо тут, тож вона з'являється МИТТЄВО: шрифти й стилі
     інтерфейсу не блокують показ, а решта скриптів ще вантажиться. Лоад-бар показує справжні етапи (скрипти -> картинка
     кімнати -> місто -> 3D-крила -> готово); підписи — зі словників (js/ui/splash.js), важку збірку веде js/main.js.
  2) Canvas #world — уся кімната (малює js/core/loop.js). Поверх — HTML-інтерфейс (стилі css/hud.css, логіка js/ui/*).
  Скрипти підключаються ПО ПОРЯДКУ: ядро -> словники -> заставка -> світ -> персонажі -> об'єкти -> UI -> старт.
============================================================================== -->
<html lang="uk" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050818">
<title>Nexora AI</title>
<!-- Шрифти Google і стилі інтерфейсу НЕ блокують показ (media="print" -> "all" після завантаження): спершу — заставка.
     NX_FONTS_CSS — обіцянка «стилі шрифтів прийшли» (js/ui/splash.js чекає її перед написами; не довше 4 с). -->
<script>window.NX_FONTS_CSS = new Promise(function (r) { window.NX_FONTS_DONE = r; setTimeout(r, 4000); });</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all';NX_FONTS_DONE()" onerror="NX_FONTS_DONE()">
<link rel="stylesheet" href="css/hud.css" media="print" onload="this.media='all'">
<style>
/* =============================================================================
   ВІТАЛЬНА ЗАСТАВКА — критичні стилі (без зовнішніх файлів і шрифтів). Кольори кімнати: неон рожевий / блакитний / фіолет
   на темно-синьому. Усе — піксель-арт, який малює скрипт нижче (і підписи — піксельним шрифтом, js/ui/splash.js).
   --u — один піксель арту: ціле число пікселів ЕКРАНА (рахує скрипт), тож піксель-арт чіткий на будь-якому телефоні.
   Прогрес скрипт пише прямо в transform заливки й Nexi на трасі (не змінною в корені — тоді браузер щокадру перераховував
   би стилі всієї заставки). Безперервний рух — лише transform / opacity: його малює відеокарта, тож він не «замерзає»,
   навіть коли браузер зайнятий збіркою кімнати. Класи — з префіксом sp- (щоб не зачепити стилі інтерфейсу css/hud.css).
   Варіанти оформлення (поки обираємо): A «Док-станція», B «Неонова траса», C «Голо-термінал» — адреса #splash-a/-b/-c.
   ============================================================================= */
html,body{margin:0;height:100%;background:#050818;overflow:hidden}
#splash{position:fixed;inset:0;z-index:60;overflow:hidden;--u:3px;--cy:#3be8ff;--pk:#ff4fd8;--dim:#2a3a8a;
  background:radial-gradient(130% 75% at 50% 40%,#151a5c 0,#0b0f38 40%,#050818 80%);transition:opacity .7s ease;-webkit-user-select:none;user-select:none}
#splash.out{opacity:0;pointer-events:none}
#splash canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#splash .sp-v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
/* екранні рядки ЕПТ і віньєтка — поверх усього */
#splash::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(#0000 0 2px,#00000038 2px 3px),radial-gradient(120% 90% at 50% 50%,#0000 55%,#000a)}
/* зорі: два шари крапок, мерехтять по черзі */
#splash .sp-stars,#splash .sp-stars::after{position:absolute;inset:0;pointer-events:none;content:'';
  background-image:radial-gradient(1.5px 1.5px at 8% 12%,#fff 90%,#0000),radial-gradient(1px 1px at 22% 30%,#9af6ff 90%,#0000),radial-gradient(1.5px 1.5px at 37% 8%,#fff 90%,#0000),radial-gradient(1px 1px at 61% 22%,#ff9af0 90%,#0000),radial-gradient(1.5px 1.5px at 78% 10%,#fff 90%,#0000),radial-gradient(1px 1px at 91% 33%,#9af6ff 90%,#0000),radial-gradient(1px 1px at 50% 3%,#fff 90%,#0000),radial-gradient(1px 1px at 70% 40%,#fff 90%,#0000);
  animation:spTw 3.2s steps(2) infinite}
#splash .sp-stars::after{transform:translate(13vw,7vh);animation-delay:-1.6s}
@keyframes spTw{50%{opacity:.25}}
/* логотип NEXORA AI (піксельний) — неонове сяйво; Nexi 48×56; відсотки; значки етапів */
#splash .sp-logo{width:calc(66 * var(--u));height:calc(7 * var(--u));filter:drop-shadow(0 0 calc(2 * var(--u)) #3be8ffaa) drop-shadow(var(--u) var(--u) 0 #ff4fd8)}
#splash .sp-tag{margin:calc(3 * var(--u)) auto 0;opacity:.85}
#splash .sp-nexi{width:calc(48 * var(--u));height:calc(56 * var(--u))}
#splash .sp-pc{width:calc(31 * var(--u) * .75);height:calc(7 * var(--u) * .75);filter:drop-shadow(0 0 calc(2 * var(--u)) #3be8ff88)}
#splash [data-ico]{width:calc(9 * var(--u));height:calc(9 * var(--u))}
/* лоад-бар (спільне): заливка росте (scaleX — плавно), поверх — сітка клітинок і відблиск, що пробігає */
#splash .sp-bar{position:relative;width:100%;height:100%}
#splash .sp-fill{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(0);transition:transform .4s linear;background:linear-gradient(90deg,#ff4fd8,#c14bff 35%,#7a6aff 60%,#3be8ff)}
#splash .sp-shine{position:absolute;inset:0;overflow:hidden}
#splash .sp-shine::before{content:'';position:absolute;top:0;bottom:0;left:0;width:22%;background:linear-gradient(90deg,#fff0,#ffffff55,#fff0);animation:spShine 1.7s linear infinite}
@keyframes spShine{from{transform:translateX(-100%)}to{transform:translateX(460%)}}
#splash .sp-retry{display:none;position:absolute;right:16px;top:16px;z-index:10;background:#070c2c;border:2px solid var(--pk);color:var(--pk);font:16px monospace;padding:6px 10px;cursor:pointer}
#splash.stall .sp-retry{display:block}
@keyframes spBob{50%{transform:translateY(calc(-1 * var(--u)))}}
@keyframes spPip{50%{transform:translateY(calc(-1 * var(--u)))}}
@keyframes spPulse{50%{opacity:.45;transform:scale(.92)}}
@keyframes spFlick{0%,100%{opacity:1}61%{opacity:.55}62%{opacity:1}64%{opacity:.7}65%{opacity:1}}

/* ---------- A · ДОК-СТАНЦІЯ: Nexi заряджається на доку, над ним — бабл з етапом, унизу — «батарейка» ---------- */
.sp-va{gap:calc(5 * var(--u))}
.sp-va .sp-tubes{position:absolute;left:0;right:0;top:0;height:30px;pointer-events:none;background:linear-gradient(#141c52,#141c52) 0 22px/100% 5px no-repeat,
  repeating-linear-gradient(90deg,#0000 0 24px,#d94bff 24px 92px,#0000 92px 152px,#3be8ff 152px 220px,#0000 220px 256px) 0 13px/100% 3px no-repeat;filter:drop-shadow(0 0 5px #d94bffaa);animation:spHum 4s steps(1) infinite}
@keyframes spHum{0%,100%{opacity:1}47%{opacity:.75}48%{opacity:1}}
.sp-va .sp-hero{position:relative;display:flex;flex-direction:column;align-items:center;margin-top:calc(36 * var(--u))}
.sp-va .sp-floor{position:absolute;left:50%;top:calc(100% - 9 * var(--u));width:220vw;height:60vh;margin-left:-110vw;pointer-events:none;z-index:-1;
  background:radial-gradient(40% 18% at 50% 0,#ff4fd855,#0000 70%),radial-gradient(70% 30% at 50% 0,#3b2a9a66,#0000 75%),linear-gradient(#120a34,#06041a 45%,#0000)}
.sp-va .sp-floor::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(#0000 0 calc(12 * var(--u)),#ffffff0d calc(12 * var(--u)) calc(12 * var(--u) + 1px));-webkit-mask:linear-gradient(#000,#0000 60%);mask:linear-gradient(#000,#0000 60%)}
.sp-va .sp-bot{position:relative;z-index:2;animation:spBob 2.6s ease-in-out infinite}
.sp-va .sp-dock{position:relative;z-index:1;width:calc(72 * var(--u));height:calc(14 * var(--u));margin-top:calc(-11 * var(--u))}
.sp-va .sp-glow{position:absolute;left:50%;bottom:calc(-4 * var(--u));width:calc(110 * var(--u));height:calc(30 * var(--u));margin-left:calc(-55 * var(--u));border-radius:50%;background:radial-gradient(closest-side,#ff4fd866,#3be8ff22 60%,#0000);animation:spPulse 1.8s ease-in-out infinite;pointer-events:none}
.sp-va .sp-refl{position:absolute;left:50%;bottom:calc(7 * var(--u));margin-left:calc(-24 * var(--u));transform:scaleY(-.5);transform-origin:50% 100%;opacity:.25;-webkit-mask:linear-gradient(#0000 35%,#000);mask:linear-gradient(#0000 35%,#000);pointer-events:none}
.sp-va .sp-bolt{position:absolute;bottom:calc(10 * var(--u));width:calc(5 * var(--u));height:calc(8 * var(--u));opacity:0;animation:spBolt 2.4s ease-out infinite;filter:drop-shadow(0 0 4px #ffe27a)}
.sp-va .sp-b1{left:calc(50% - 30 * var(--u))}.sp-va .sp-b2{left:calc(50% + 25 * var(--u));animation-delay:-.8s}.sp-va .sp-b3{left:calc(50% - 4 * var(--u));animation-delay:-1.6s;bottom:calc(4 * var(--u))}
@keyframes spBolt{0%{opacity:0;transform:translateY(0)}15%{opacity:1}70%{opacity:.9}100%{opacity:0;transform:translateY(calc(-26 * var(--u)))}}
/* бабл — як бабл Nexi в кімнаті: темне скло, блакитна рамка, хвостик донизу */
.sp-va .sp-bub{position:absolute;bottom:calc(100% + 2 * var(--u));left:50%;transform:translateX(-50%);z-index:3;box-sizing:border-box;
  background:#050a26f2;border:2px solid var(--cy);box-shadow:0 0 14px #3be8ff77;padding:calc(3 * var(--u)) calc(4 * var(--u)) calc(3 * var(--u));display:flex;flex-direction:column;gap:calc(2 * var(--u))}
.sp-va .sp-bub::after{content:'';position:absolute;left:50%;bottom:-8px;width:12px;height:12px;margin-left:-6px;background:#050a26;border:solid var(--cy);border-width:0 2px 2px 0;transform:rotate(45deg)}
.sp-va .sp-bat{position:relative;width:min(520px,78vw);height:calc(9 * var(--u));padding:var(--u);box-sizing:border-box;border:var(--u) solid var(--cy);background:#060a26;box-shadow:0 0 0 var(--u) #0a1240,0 0 18px #3be8ff55,inset 0 0 10px #3be8ff22}
.sp-va .sp-bat::after{content:'';position:absolute;right:calc(-4 * var(--u));top:28%;bottom:28%;width:calc(2 * var(--u));background:var(--cy);box-shadow:0 0 8px #3be8ff}
.sp-va .sp-cells{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#0000 0 calc(5% - var(--u)),#060a26 calc(5% - var(--u)) 5%)}
.sp-va .sp-meta{display:flex;align-items:center;justify-content:space-between;width:min(520px,78vw)}
.sp-va .sp-pips{display:flex;gap:calc(4 * var(--u));list-style:none;margin:0;padding:0}
.sp-va .sp-pips li.cur{animation:spPip .7s steps(2) infinite}
.v-a.done .sp-bat{animation:spFull .25s steps(2) 3}
@keyframes spFull{50%{box-shadow:0 0 0 var(--u) #0a1240,0 0 40px #3be8ffcc,inset 0 0 22px #3be8ff88}}

/* ---------- B · НЕОНОВА ТРАСА: Nexi летить на ранці над монорейкою від етапу до етапу, місто внизу засвічує вікна ---------- */
.sp-vb{justify-content:flex-start;padding-bottom:calc((var(--skyh,46) + 6) * var(--u))}
.sp-vb .sp-sign{margin-top:max(7vh,calc(10 * var(--u)));padding:calc(5 * var(--u)) calc(7 * var(--u)) calc(4 * var(--u));border:var(--u) solid var(--pk);background:#0a0626e6;
  box-shadow:0 0 0 var(--u) #3a0f4a,0 0 22px #ff4fd877,inset 0 0 16px #ff4fd833;animation:spFlick 5s steps(1) infinite}
.sp-vb .sp-track{position:relative;width:min(760px,92vw);height:min(calc(78 * var(--u)),42vh);margin-top:auto;flex:none}
.sp-vb .sp-rail{position:absolute;left:0;right:0;bottom:calc(12 * var(--u));height:calc(2 * var(--u));background:#1b2a66;box-shadow:0 calc(2 * var(--u)) 0 #0a1240}
.sp-vb .sp-rail .sp-fill{transition:transform .45s ease-out;box-shadow:0 0 12px #ff4fd8,0 0 18px #3be8ff88}
.sp-vb .sp-rail::after{content:'';position:absolute;left:0;right:0;top:calc(3 * var(--u));height:calc(2 * var(--u));background:repeating-linear-gradient(90deg,#2a3a8a 0 var(--u),#0000 var(--u) calc(6 * var(--u)))}
.sp-vb .sp-stations{position:absolute;left:0;right:0;bottom:calc(6 * var(--u));list-style:none;margin:0;padding:0}
.sp-vb .sp-stations li{position:absolute;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
/* станції — на кінцях п'яти рівних відрізків траси; --ri — відступ від країв траси (півширини Nexi мінус поле екрана; рахує скрипт), щоб він не виходив за край екрана */
.sp-vb .sp-stations li:nth-child(1){left:calc(var(--ri,0px) + (100% - 2 * var(--ri,0px)) * .2)}.sp-vb .sp-stations li:nth-child(2){left:calc(var(--ri,0px) + (100% - 2 * var(--ri,0px)) * .4)}
.sp-vb .sp-stations li:nth-child(3){left:calc(var(--ri,0px) + (100% - 2 * var(--ri,0px)) * .6)}.sp-vb .sp-stations li:nth-child(4){left:calc(var(--ri,0px) + (100% - 2 * var(--ri,0px)) * .8)}.sp-vb .sp-stations li:nth-child(5){left:calc(100% - var(--ri,0px))}
.sp-vb .sp-stations i{display:block;padding:var(--u);border:var(--u) solid var(--dim);background:#070c2c}
.sp-vb .sp-stations li.cur i{border-color:var(--pk);box-shadow:0 0 12px #ff4fd8;animation:spPip .7s steps(2) infinite}
.sp-vb .sp-stations li.on i{border-color:var(--cy);box-shadow:0 0 10px #3be8ff88}
#splash .sp-vb .sp-stations .sp-tx{position:absolute;top:calc(100% + 3 * var(--u));display:none}
.sp-vb .sp-rider{position:absolute;left:0;bottom:calc(22 * var(--u));transition:transform .45s ease-out;z-index:2}
.sp-vb .sp-rider .sp-bot{position:relative;margin-left:calc(-19.2 * var(--u));animation:spHover .5s ease-in-out infinite alternate}
@keyframes spHover{to{transform:translateY(calc(-2 * var(--u)))}}
.sp-vb .sp-rider .sp-nexi{width:calc(48 * var(--u) * .8);height:calc(56 * var(--u) * .8)}
.sp-vb .sp-trail{position:absolute;right:100%;bottom:calc(9 * var(--u));width:calc(30 * var(--u));height:var(--u);background:linear-gradient(90deg,#0000,#ff4fd8aa,#ffe27a);transform-origin:100% 50%;animation:spTrail .18s steps(2) infinite}
.sp-vb .sp-trail+.sp-trail{bottom:calc(5 * var(--u));width:calc(18 * var(--u));background:linear-gradient(90deg,#0000,#3be8ffaa,#fff);animation-delay:-.09s}
@keyframes spTrail{50%{transform:scaleX(.6);opacity:.7}}
.sp-vb .sp-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;width:min(760px,92vw);margin:calc(10 * var(--u)) 0 auto}
.sp-vb .sp-meta div{display:flex;flex-direction:column;gap:calc(2 * var(--u));min-width:0}
.sp-vb .sp-meta [data-sp="stage"]{filter:drop-shadow(0 0 6px #ff4fd8)}
.sp-vb .sp-skyline{position:absolute;left:0;bottom:0}
.sp-vb .sp-haze{position:absolute;left:0;right:0;bottom:0;height:calc(70 * var(--u));background:linear-gradient(#0000,#ff4fd822 55%,#3b1a6a44);pointer-events:none}
@media(min-width:700px){#splash .sp-vb .sp-stations .sp-tx{display:block}}
@media(max-width:520px){.sp-vb .sp-rider .sp-nexi{width:calc(48 * var(--u) * .7);height:calc(56 * var(--u) * .7)}.sp-vb .sp-rider .sp-bot{margin-left:calc(-16.8 * var(--u))}
  #splash .sp-vb .sp-stations [data-ico]{width:calc(9 * var(--u) * .75);height:calc(9 * var(--u) * .75)}.sp-vb .sp-stations i{padding:calc(.5 * var(--u))}}   /* вузький телефон: менші Nexi й станції */

/* ---------- C · ГОЛО-ТЕРМІНАЛ: журнал запуску на голо-екрані (як екран маркетингу), блоковий лоад-бар, Nexi набирає ---------- */
.sp-vc{gap:calc(6 * var(--u))}
.sp-vc .sp-term{position:relative;width:min(600px,92vw);box-sizing:border-box;padding:calc(4 * var(--u)) calc(5 * var(--u)) calc(5 * var(--u));overflow:hidden;
  background:linear-gradient(#0b1a5ad9,#071036e6);border:var(--u) solid var(--pk);box-shadow:0 0 0 var(--u) #3a0f4a,0 0 26px #ff4fd855,inset 0 0 30px #3b8aff44;animation:spFlick 7s steps(1) infinite}
.sp-vc .sp-term::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(#0000 0 3px,#3be8ff10 3px 4px);pointer-events:none}
.sp-vc .sp-band{position:absolute;left:0;right:0;top:0;height:22%;background:linear-gradient(#0000,#9af6ff14,#0000);animation:spBand 3.4s linear infinite;pointer-events:none}
@keyframes spBand{from{transform:translateY(-100%)}to{transform:translateY(560%)}}
.sp-vc .sp-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:calc(3 * var(--u));margin-bottom:calc(2 * var(--u));border-bottom:var(--u) solid #3be8ff44}
.sp-vc .sp-head .sp-logo{width:calc(66 * var(--u) * .6);height:calc(7 * var(--u) * .6)}
.sp-vc .sp-leds{display:flex;gap:calc(2 * var(--u))}
.sp-vc .sp-leds i{width:calc(3 * var(--u));height:calc(3 * var(--u));background:var(--pk);animation:spPip 1s steps(2) infinite}
.sp-vc .sp-leds i+i{background:var(--cy);animation-delay:-.33s}.sp-vc .sp-leds i+i+i{background:#ffe27a;animation-delay:-.66s}
.sp-vc .sp-log{list-style:none;margin:0;padding:0}
.sp-vc .sp-log li{display:flex;align-items:center;gap:calc(3 * var(--u));padding:var(--u) 0;opacity:.5}

.sp-vc .sp-log li i{flex:1;min-width:calc(2 * var(--u));height:var(--u);margin-top:calc(2 * var(--u));background:repeating-linear-gradient(90deg,#3a4a9a 0 var(--u),#0000 var(--u) calc(3 * var(--u)))}
.sp-vc .sp-log li.cur,.sp-vc .sp-log li.on{opacity:1}
.sp-vc .sp-log li.cur [data-em]{animation:spCur .5s steps(2) infinite}
@keyframes spCur{50%{opacity:.4}}
.sp-vc .sp-blocks{height:calc(7 * var(--u));margin-top:calc(4 * var(--u));border:var(--u) solid #3be8ff66;padding:var(--u);background:#050a26}
.sp-vc .sp-cells{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#0000 0 calc(6.25% - var(--u)),#050a26 calc(6.25% - var(--u)) 6.25%),linear-gradient(#ffffff40 0 var(--u),#0000 var(--u) calc(100% - var(--u)),#00000060 calc(100% - var(--u)))}
.sp-vc .sp-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:calc(3 * var(--u))}
.sp-vc .sp-bot{position:relative;animation:spBob 2.2s ease-in-out infinite}
.sp-vc .sp-holo{position:absolute;left:50%;bottom:calc(-2 * var(--u));width:calc(40 * var(--u));height:calc(6 * var(--u));margin-left:calc(-20 * var(--u));background:radial-gradient(closest-side,#3be8ff88,#0000);animation:spPulse 1.2s ease-in-out infinite}

@keyframes spGlitch{33%{transform:translateX(calc(2 * var(--u)));filter:drop-shadow(-3px 0 #ff4fd8) drop-shadow(3px 0 #3be8ff)}66%{transform:translateX(calc(-2 * var(--u)))}}

</style>

      if (!rd) { const b = await r.blob(); S.set('img', .9); return URL.createObjectURL(b); }
      const parts = []; let got = 0;
      for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length; S.set('img', Math.min(.9, got / n * .9)); }
      return URL.createObjectURL(new Blob(parts, { type: r.headers.get('content-type') || 'image/webp' }));
    } catch (e) { return null; }
  })();
})();
</script>
